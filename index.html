<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0e1b">
<title>MEXT Ráfaga</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<style>
/* ===== Tema 和紙 (claro) ===== */
:root{--bg:#f6f0e4;--surface:#fffdf8;--surface2:#f2eadb;--text:#211b17;--muted:#74695e;--line:#e4d8c4;
  --accent:#d63a2f;--accent2:#b07d12;--accent-t:#fff;--ok:#1d8a50;--okbg:#e2f3e8;--bad:#c9302c;--badbg:#fbe6e2;--warn:#b26b00;--warnbg:#fbefd9;--amar:#e3b100;--focus:#2457d6;
  --glow:rgba(214,58,47,.18);--shadow:0 1px 2px rgba(60,40,20,.06),0 6px 20px rgba(60,40,20,.07);
  --part:#0b8aa3;--jita:#7348d1;--ctr:#bb7400;--kanji:#d63a2f;--syn:#1c9459;--morph:#c23c7c;--mix:#211b17;--buf:#b26b00;--dia:#2563c9;--days:#2563c9;--esc:#0f8a6a;--prod:#0f8a6a}
/* ===== Tema 夜 (oscuro) ===== */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0e1b;--surface:#161a2d;--surface2:#1f2440;--text:#f2efe8;--muted:#a2a5bc;--line:#2a2f4f;
  --accent:#ff5a4e;--accent2:#ffc857;--accent-t:#1a0705;--ok:#3ddc84;--okbg:rgba(61,220,132,.13);--bad:#ff6b6b;--badbg:rgba(255,107,107,.13);--warn:#ffb347;--warnbg:rgba(255,179,71,.13);--amar:#ffd84d;--focus:#8fb0ff;
  --glow:rgba(255,90,78,.22);--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25);
  --part:#3cc8e6;--jita:#ad90ff;--ctr:#ffb84d;--kanji:#ff6b5e;--syn:#4fe090;--morph:#ff7ab6;--mix:#f2efe8;--buf:#ffb347;--dia:#7fb2ff;--days:#7fb2ff;--esc:#4fd1a8;--prod:#4fd1a8}}
:root[data-theme="dark"]{--bg:#0c0e1b;--surface:#161a2d;--surface2:#1f2440;--text:#f2efe8;--muted:#a2a5bc;--line:#2a2f4f;
  --accent:#ff5a4e;--accent2:#ffc857;--accent-t:#1a0705;--ok:#3ddc84;--okbg:rgba(61,220,132,.13);--bad:#ff6b6b;--badbg:rgba(255,107,107,.13);--warn:#ffb347;--warnbg:rgba(255,179,71,.13);--amar:#ffd84d;--focus:#8fb0ff;
  --glow:rgba(255,90,78,.22);--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25);
  --part:#3cc8e6;--jita:#ad90ff;--ctr:#ffb84d;--kanji:#ff6b5e;--syn:#4fe090;--morph:#ff7ab6;--mix:#f2efe8;--buf:#ffb347;--dia:#7fb2ff;--days:#7fb2ff;--esc:#4fd1a8;--prod:#4fd1a8}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--text);background-color:var(--bg)}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;font-size:16px;line-height:1.45;min-height:100dvh;
  background-image:radial-gradient(900px 420px at 50% -120px,var(--glow),transparent 70%),var(--pat,none);background-attachment:fixed}
#app{max-width:780px;margin:0 auto;padding:14px 16px calc(28px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.center{text-align:center}
.hide{display:none!important}
.stack>*+*{margin-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
h3{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 2px 10px;font-weight:700}
.card h3{margin:0 0 10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;min-height:44px}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:1.1rem}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.kbd{font-family:ui-monospace,monospace;font-size:.75rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:0 5px;color:var(--muted);background:var(--surface)}

/* ===== Marca ===== */
.brand{display:flex;align-items:center;gap:10px}
.hanko{width:42px;height:42px;border-radius:10px;background:var(--accent);color:var(--accent-t);display:grid;place-items:center;font-weight:900;font-size:1.25rem;transform:rotate(-4deg);box-shadow:0 4px 14px var(--glow)}
.brand b{display:block;font-size:1.15rem;letter-spacing:.02em}
.nivel{display:inline-block;margin-left:7px;padding:1px 8px;border-radius:99px;border:1.5px solid var(--accent);color:var(--accent);font-size:.72rem;font-weight:900;letter-spacing:.06em;vertical-align:2px}
.brand small{color:var(--muted);font-size:.78rem}

/* ===== Hero ===== */
.hero{display:flex;align-items:center;gap:16px;margin-top:16px;padding:16px;border-radius:22px;background:linear-gradient(135deg,var(--surface),var(--surface2));border:1px solid var(--line);box-shadow:var(--shadow)}
.ring{position:relative;flex:none;width:104px;height:104px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.ring .in b{font-size:1.9rem;font-weight:900;font-variant-numeric:tabular-nums;display:block}
.ring .in small{font-size:.7rem;color:var(--muted)}
.eyebrow{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:800}
.hero .h{font-size:1.05rem;font-weight:700;margin:4px 0 10px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.8rem;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-variant-numeric:tabular-nums}

/* ===== Botón principal ===== */
.start{position:relative;width:100%;margin-top:16px;border:0;border-radius:20px;padding:18px 20px;display:flex;align-items:center;gap:16px;text-align:left;color:#fff;
  background:linear-gradient(120deg,#e8453a,#c4252b 55%,#8e1a3a);box-shadow:0 10px 30px var(--glow),inset 0 1px 0 rgba(255,255,255,.25);overflow:hidden}
.start::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.22) 50%,transparent 70%);transform:translateX(-100%);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{0%,55%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.start .play{flex:none;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:1.4rem;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.35)}50%{box-shadow:0 0 0 10px rgba(255,255,255,0)}}
.start b{display:block;font-size:1.3rem}
.start small{opacity:.85;font-size:.85rem}
.start:active{transform:scale(.99)}

/* ===== Modos ===== */
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:640px){.modes{grid-template-columns:repeat(4,1fr)}}
.mode{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px;min-height:104px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow);overflow:hidden;transition:transform .12s,border-color .12s}
.mode:hover{transform:translateY(-2px);border-color:var(--c)}
.mode:active{transform:scale(.98)}
.mode.on{border-color:var(--c);box-shadow:0 0 0 1.5px var(--c),var(--shadow)}
.glyph{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:900;font-size:1.05rem;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);margin-bottom:6px;flex:none}
.mode .mn{font-weight:800;font-size:.98rem}
.mode .ms{font-size:.74rem;color:var(--muted);line-height:1.25}
.mode .acc{position:absolute;top:12px;right:12px;font-size:.78rem;font-weight:800;font-variant-numeric:tabular-nums;color:var(--muted)}
.mode .mb{position:absolute;left:0;bottom:0;height:3px;background:var(--c);opacity:.9}
.mode .badge{position:absolute;top:10px;right:10px;min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:var(--c);color:var(--bg);font-size:.75rem;font-weight:900;display:grid;place-items:center}

/* ===== Medidores ===== */
.meter{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--ok);transition:width .6s}
.meter i.warn{background:var(--warn)} .meter i.bad{background:var(--bad)} .meter i.none{background:var(--line)}
.catrow{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.catrow:first-of-type{border-top:0;padding-top:2px}
.catrow .glyph{margin:0;grid-row:span 2}
.catrow .meter,.catrow .sub{grid-column:2/-1}
.catrow .sub{font-size:.75rem;color:var(--muted)}
.pct{font-variant-numeric:tabular-nums;font-weight:800}

/* ===== Ajustes ===== */
details.card summary{cursor:pointer;font-weight:700;list-style:none;display:flex;align-items:center;gap:8px}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"＋";margin-left:auto;color:var(--muted)}
details[open].card summary::after{content:"－"}
.set{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface2)}
.seg button{border:0;background:transparent;padding:8px 12px;min-height:40px;font-size:.9rem}
.seg button.on{background:var(--text);color:var(--bg);font-weight:700}

/* ===== Drill ===== */
.hud{display:flex;align-items:center;gap:10px;position:relative}
.score{line-height:1}
.score b{font-size:1.6rem;font-weight:900;font-variant-numeric:tabular-nums;display:block}
.score small{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.float{position:absolute;left:58px;top:-6px;font-weight:900;color:var(--accent2);font-size:1.1rem;pointer-events:none;animation:floatUp .9s ease-out forwards}
@keyframes floatUp{0%{opacity:0;transform:translateY(8px) scale(.8)}20%{opacity:1;transform:translateY(0) scale(1.15)}100%{opacity:0;transform:translateY(-26px) scale(1)}}
.combo{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;font-weight:900;font-variant-numeric:tabular-nums;color:#2a1a00;background:linear-gradient(135deg,#ffe08a,#ffb547);box-shadow:0 4px 16px rgba(255,181,71,.35);animation:bump .3s}
.combo.hot{color:#fff;background:linear-gradient(135deg,#ff8a3d,#ff3d5a);box-shadow:0 4px 20px rgba(255,61,90,.45)}
@keyframes bump{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.tring{position:relative;width:48px;height:48px;flex:none}
.tring svg{width:100%;height:100%;transform:rotate(-90deg)}
.tring span{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:.85rem;font-variant-numeric:tabular-nums}
.tring.low circle.fg{stroke:var(--accent)}
.tring.low span{color:var(--accent)}
.qcard{position:relative;margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px 16px 0;box-shadow:var(--shadow);overflow:hidden}
.qcard::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--c)}
.qcard .wm{position:absolute;right:-6px;bottom:-26px;font-size:7.5rem;font-weight:900;color:var(--c);opacity:.07;pointer-events:none;line-height:1}
.qcard.pop{animation:okpulse .45s}
@keyframes okpulse{0%{box-shadow:0 0 0 0 var(--ok)}100%{box-shadow:0 0 0 16px transparent}}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font-size:.74rem;font-weight:700;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--c,var(--muted)) 14%,transparent);color:var(--c,var(--muted))}
.tag.buf{--c:var(--warn)}
.tag.last{--c:var(--bad);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.4}}
.head{font-size:.84rem;color:var(--muted);text-align:center;margin-top:10px}
.prompt{position:relative;font-size:1.6rem;line-height:1.95;padding:12px 6px 20px;text-align:center;overflow-wrap:anywhere}
.prompt.long{font-size:1.25rem;text-align:left}
.prompt u{text-decoration:none;background:linear-gradient(transparent 62%,color-mix(in srgb,var(--c) 30%,transparent) 62%);padding:0 2px;border-radius:2px}
.blank{color:var(--c);font-weight:800;white-space:nowrap}
ruby rt{font-size:.5em;color:var(--muted);font-weight:400}
.qtimer{height:5px;background:var(--surface2);margin:0 -16px}
.qtimer i{display:block;height:100%;width:100%;background:var(--ok);transition:background .3s}
.qtimer i.mid{background:var(--warn)} .qtimer i.low{background:var(--bad)}
.opts{display:grid;grid-template-columns:1fr;gap:10px;margin-top:14px}
@media (min-width:640px){.opts:not(.long){grid-template-columns:1fr 1fr}}
.opt{position:relative;display:flex;align-items:center;gap:14px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px;min-height:62px;font-size:1.32rem;line-height:1.6;box-shadow:var(--shadow);transition:transform .08s,border-color .12s,background .12s}
.opt:hover{border-color:var(--c)}
.opts.long .opt{font-size:1.05rem}
.opt:active{transform:scale(.98)}
.opt .k{flex:none;width:30px;height:30px;border-radius:9px;background:var(--surface2);color:var(--muted);font-size:.85rem;display:grid;place-items:center;font-weight:800;transition:background .12s,color .12s}
.opt:hover .k{background:var(--c);color:var(--bg)}
.opt.ok{border-color:var(--ok);background:var(--okbg);animation:pop .35s}
.opt.ok .k{background:var(--ok);color:var(--bg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.bad .k{background:var(--bad);color:var(--bg)}
.opt.dim{opacity:.4;box-shadow:none}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
.opts.shake{animation:shake .38s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.fb{display:flex;gap:12px;margin-top:14px;border-radius:18px;padding:14px;background:var(--surface);border:1.5px solid var(--bad);box-shadow:0 8px 26px var(--badbg);animation:rise .25s ease-out;cursor:pointer}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fb .ic{flex:none;width:34px;height:34px;border-radius:50%;background:var(--bad);color:var(--bg);display:grid;place-items:center;font-weight:900}
.fb .h{font-size:.92rem;color:var(--muted);margin-bottom:6px}
.fb .h b{color:var(--text)}
.fb .r1{font-weight:700;margin:0 0 4px}
.fb .r2{margin:0;color:var(--muted)}
.fb .n{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:.78rem;color:var(--muted)}
.fb .go-on{margin-left:auto;font-weight:800;color:var(--text);background:var(--surface2);border-radius:99px;padding:6px 14px}

/* ===== Final ===== */
.endhero{position:relative;text-align:center;padding:26px 16px 20px;border-radius:24px;background:linear-gradient(160deg,var(--surface),var(--surface2));border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
.stamp{width:108px;height:108px;margin:0 auto 10px;border:5px solid var(--accent);border-radius:50%;display:grid;place-items:center;color:var(--accent);font-size:3.1rem;font-weight:900;transform:rotate(-12deg);animation:stamp .5s cubic-bezier(.2,1.6,.4,1) both;box-shadow:inset 0 0 0 3px var(--surface),inset 0 0 0 5px var(--accent)}
@keyframes stamp{0%{opacity:0;transform:rotate(-12deg) scale(2.2)}100%{opacity:1;transform:rotate(-12deg) scale(1)}}
.stamp-l{font-weight:800;color:var(--accent);letter-spacing:.08em;font-size:.82rem}
.big{font-size:3rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:6px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.kpi b{display:block;font-size:1.3rem;font-variant-numeric:tabular-nums}
.kpi span{font-size:.72rem;color:var(--muted)}
.cta{display:flex;gap:10px}
.cta .start{margin-top:0;flex:2;padding:16px}
.cta .btn{flex:1;border-radius:20px}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(420px) rotate(540deg);opacity:0}}

/* ===== Listas ===== */
.list{margin:0;padding:0;list-style:none}
.list li{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:.95rem}
.list li:first-child{border-top:0}
.list .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dots{letter-spacing:2px;color:var(--warn);font-size:.8rem}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:700;font-size:.92rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);text-align:center;z-index:9;box-shadow:var(--shadow)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.pill[data-s="ok"]{color:var(--ok)}.pill[data-s="warn"]{color:var(--warn)}.pill[data-s="bad"]{color:var(--bad)}.pill[data-s="muted"]{color:var(--muted)}
button.pill{cursor:pointer;font-family:inherit}
.pill.viejo{opacity:.55}.pill.viejo .hace{font-weight:600}.nivel.viejo{opacity:.55}
.syncbox{display:grid;gap:10px;padding:12px;border-radius:14px;background:var(--surface2)}
.syncbox label{display:grid;gap:4px;font-size:.85rem;color:var(--muted)}
.syncbox input{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
/* ===== Estudio diario: sobrio, sin gamificación ===== */
.tabs{display:flex;gap:6px;padding:4px;margin-bottom:14px;border-radius:14px;background:var(--surface2);border:1px solid var(--line)}
.tabs button{flex:1;border:0;background:transparent;border-radius:10px;padding:10px;min-height:44px;font-weight:700;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.estudio{line-height:1.6}.au{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:8px 0 4px}.au audio{width:100%;max-width:420px}.au .muted.small{flex-basis:100%}.au-on{color:var(--bad,#c33);font-weight:600}.au-dot{width:12px;height:12px;border-radius:50%;background:var(--bad,#c33);animation:aupl 1s infinite}@keyframes aupl{50%{opacity:.25}}.au-tx{flex-basis:100%;margin-top:2px}.simpdf{max-height:62vh;overflow:auto;border:1px solid var(--line,#ddd);border-radius:12px;background:#fff;margin:4px 0 12px;-webkit-overflow-scrolling:touch}.simpdf img{display:block;width:100%;height:auto}.simpdf img+img{border-top:1px solid #ddd}.estudio .stack>*+*{margin-top:12px}
.estat{font-size:.82rem;margin:6px 0 14px;color:var(--muted)}.estat[data-s="warn"]{color:var(--warn)}.estat[data-s="bad"]{color:var(--bad)}
.ecard{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;min-height:64px}
.ecard b{font-size:1.02rem}.ehoy{border-left:4px solid var(--part)}.eempty{cursor:default}
.echip{align-self:flex-start;font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.echip[data-st="Publicada"]{color:var(--part)}.echip[data-st="Entregada"]{color:var(--warn)}.echip[data-st="Corregida"]{color:var(--ok)}
.etitle{display:block;font-size:1.1rem;overflow-wrap:anywhere}
.ebar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:12px -16px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.esec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}

{id:'p07',c:'part',q:'へや（　）{入|はい}って ください。',o:['に','で','を','が'],x:'入る: el espacio al que entras va con に (punto de llegada).\nで sería "dentro del cuarto haz algo", no el acto de entrar.'},
{id:'p08',c:'part',q:'はこ（　）ペンを {入|い}れました。',o:['に','で','が','を'],x:'入れる: Xに Yを 入れる — に = recipiente/destino, を = objeto movido.\nEs justo el に que omitiste el 6 oct.'},
{id:'p09',c:'part',q:'デパート（　）くつを かいました。',o:['で','に','へ','を'],x:'買う ocurre en la tienda → で.\nComprar no desplaza al sujeto hacia ningún lado.'},
{id:'p10',c:'part',q:'なつやすみに おきなわ（　）いきたいです。',o:['に','で','を','と'],x:'行きたい sigue siendo 行く: destino → に/へ.\nたい no cambia la partícula del lugar.'},
{id:'p11',c:'part',q:'えき（　）ともだちに あいました。',o:['で','に','へ','を'],x:'会う ocurre en la estación → で. El に de ともだちに marca a la persona.\nLugar donde sucede un evento = で.'},
{id:'p12',c:'part',q:'つくえの {上|うえ}（　）ねこが います。',o:['に','で','へ','を'],x:'いる/ある (existencia) marcan la ubicación con に.\nで exige una acción; existir no es una acción.'},
{id:'p13',c:'part',q:'レストラン（　）はたらいています。',o:['で','に','へ','を'],x:'働く = acción en el lugar → で.\nContraste: 会社に つとめています (勤める pide に).'},
{id:'p14',c:'part',q:'らいねん {日本|にほん}（　）べんきょうしたいです。',o:['で','に','へ','を'],x:'勉強する ocurre en Japón → で.\nIr a Japón = 日本に行く; estudiar en Japón = 日本で勉強する.'},
{id:'p15',c:'part',q:'なんじに うち（　）かえりますか。',o:['に','で','を','が'],x:'帰る = movimiento de regreso → に/へ.\nで no puede marcar el destino de un verbo de movimiento.'},
{id:'p16',c:'part',q:'この はし（　）わたって ください。',o:['を','で','に','へ'],x:'Lugar que ATRAVIESAS con verbo de movimiento → を (camino).\nわたる / とおる / あるく marcan el trayecto con を (lo viste en Tofugu).'},
{id:'p17',c:'part',q:'つぎの えきで バス（　）おります。',o:['を','に','で','が'],x:'Bajar/salir de algo (降りる/出る) marca el punto de partida con を.\nに sería subir: バスに のります.'},
{id:'p18',c:'part',q:'えきで でんしゃ（　）のります。',o:['に','で','を','へ'],x:'乗る: el vehículo al que subes = punto de llegada → に.\nContraste: でんしゃを おりる (bajar = punto de salida → を).'},
{id:'p19',c:'part',q:'だいどころ（　）りょうりを つくります。',o:['で','に','を','へ'],x:'Cocinar ocurre en la cocina → で.\nを ya está ocupado por りょうり (el objeto).'},
{id:'p20',c:'part',q:'としょかん（　）{本|ほん}を かえしに いきます。',o:['へ','で','を','が'],x:'El verbo FINAL es 行く: destino → へ. 返しに es el propósito (otro に).\nTrampa del 23 sep: pensar "devuelvo libros allí" → で.'},
{id:'p21',c:'part',q:'{山田|やまだ}さんは いま {会議室|かいぎしつ}（　）います。',o:['に','で','を','へ'],x:'いる (existencia/ubicación) → に.\nSi dijera 会議室で はなしています, ahí sí で (acción).'},
{id:'p22',c:'part',q:'きのう ともだちの いえ（　）パーティーが ありました。',o:['で','に','を','へ'],x:'ある de EVENTO (fiesta, examen, reunión) = algo que sucede → で.\nある de objetos → に. Mismo verbo, distinta partícula.'},
{id:'p23',c:'part',q:'ここ（　）しゃしんを とらないで ください。',o:['で','に','を','へ'],x:'Tomar fotos = acción en este lugar → で.\nLa negación (ないで) no cambia la partícula de lugar.'},
{id:'p24',c:'part',q:'きょうしつ（　）{出|で}て ください。',o:['を','に','で','が'],x:'出る: el lugar que ABANDONAS → を (o から).\nに/へ serían el destino: lo contrario.'},
{id:'p25',c:'part',q:'わたしは まいあさ ７{時|じ}（　）おきます。',o:['に','で','を','へ'],x:'Hora exacta → に.\nで nunca marca tiempo puntual.'},
{id:'p26',c:'part',q:'あした わたしの うち（　）きて ください。',o:['に','で','を','が'],x:'来る = movimiento hacia mi casa → に (destino).\nで sería "haz algo en mi casa".'},
{id:'p27',c:'part',q:'あした どこ（　）あいましょうか。',o:['で','に','へ','を'],x:'会う ocurre en un lugar → で (punto de encuentro).\nNo hay desplazamiento en 会う: no lleva に/へ para el lugar.'},
{id:'p28',c:'part',q:'この バスは くうこう（　）いきますか。',o:['に','で','を','が'],x:'行く + destino → に.\nで sería "en el aeropuerto", no "hacia".'},

/* ===== Transitivo / intransitivo ===== */
{id:'j01',c:'jita',q:'へやが くらいです。でんきを（　）ください。',o:['つけて','ついて','つけ','つけます'],x:'を = alguien actúa sobre la luz → transitivo つける; ください pide forma て: つけて.\nつく es intransitivo (se enciende sola): no admite を.',w:{'つけます':'ください NUNCA va con ます: siempre forma て (つけて). Tu patrón del 6 oct.'}},
{id:'j02',c:'jita',q:'でんきを（　）ください。',o:['けして','きえて','けします','きえます'],x:'電気を → transitivo 消す; en forma て = 消して.\nきえる (apagarse solo) va con が: でんきが きえました (tu fallo I-4).',w:{'けします':'ください pide forma て: けして, no けします (patrón del 6 oct).'}},
{id:'j03',c:'jita',q:'かぜで ドアが（　）。',o:['あきました','あけました','あけて','あいて'],x:'が + causa natural (viento) → intransitivo 開く: あきました.\nあける exige un agente que la abra con を.'},
{id:'j04',c:'jita',q:'すみません、まどを（　）も いいですか。',o:['あけて','あいて','あけ','あけます'],x:'まどを → transitivo 開ける; 〜てもいい pide forma て: あけて.\nあいて (開く) no puede tener objeto con を.'},
{id:'j05',c:'jita',q:'じゅぎょうが ９{時|じ}に（　）。',o:['はじまります','はじめます','はじめて','はじまって'],x:'じゅぎょうが (la clase empieza, sin agente) → intransitivo 始まる.\n始める necesita a alguien: 先生が じゅぎょうを はじめます.'},
{id:'j06',c:'jita',q:'{先生|せんせい}が テストを（　）。',o:['はじめました','はじまりました','はじまって','はじめて'],x:'テストを (objeto) + agente 先生が → transitivo 始める.\n始まる no admite を: テストが はじまりました.'},
{id:'j07',c:'jita',q:'みせが ８{時|じ}に（　）。',o:['しまります','しめます','しめて','しまって'],x:'みせが, sin agente → intransitivo 閉まる.\n閉める exige alguien: 私が 店を 閉めます.'},
{id:'j08',c:'jita',q:'さむいですから、ドアを（　）ください。',o:['しめて','しまって','しめ','しめます'],x:'ドアを + ください → 閉める en forma て: しめて.\nください nunca va con ます.'},
{id:'j09',c:'jita',q:'さいふに おかねが（　）います。',o:['はいって','いれて','はいり','いれ'],x:'おかねが + ている (estado resultante) → intransitivo 入る: はいっています.\n入れています = alguien está metiendo dinero (acción en curso).'},
{id:'j10',c:'jita',q:'コーヒーに さとうを（　）か。',o:['いれます','はいります','いれて','はいって'],x:'さとうを → transitivo 入れる: Xに Yを 入れる.\n入る no lleva objeto: さとうが はいっています.'},
{id:'j11',c:'jita',q:'あれ？ でんきが（　）。だれも いないのに。',o:['ついています','つけています','ついてください','つけてください'],x:'でんきが + ている = estado resultante (está encendida) → ついています.\nつけています = alguien la está encendiendo: choca con だれも いない.'},
{id:'j12',c:'jita',q:'{停電|ていでん}で、でんきが（　）。',o:['きえました','けしました','きえて','けして'],x:'が + causa externa (apagón) → intransitivo 消える: きえました.\nけしました necesita a alguien que apague algo con を.'},
{id:'j13',c:'jita',q:'ねる まえに、テレビを（　）。',o:['けします','きえます','きえません','つきます'],x:'テレビを → transitivo 消す: けします.\nきえる/つく son intransitivos: no pueden llevar を.'},
{id:'j14',c:'jita',q:'まどが（　）いますね。しめましょうか。',o:['あいて','あけて','あいた','あけた'],x:'まどが + ている = estado visible (está abierta) → 開いて.\nRegla: が + 自動詞 + ている = resultado (tu matiz del 6 oct).'},
{id:'j15',c:'jita',q:'きのう へやの でんきを（　）。',o:['つけました','つきました','つけます','つけて'],x:'きのう exige pasado (〜ました); を → transitivo つける → つけました.\nTu error del 6 oct: tiempo presente con 昨日.',w:{'つけます':'Transitivo bien, tiempo mal: きのう → つけました.'}},
{id:'j16',c:'jita',q:'えいがは もう（　）よ。いそいで！',o:['はじまっています','はじめています','はじめて','はじめます'],x:'えいがは (sin agente) + もう + ている = ya empezó y sigue → 始まっています.\nはじめています = alguien está empezando algo: falta el objeto.'},
{id:'j17',c:'jita',q:'どうぞ、へやに（　）ください。',o:['はいって','いれて','はいり','いれ'],x:'Tú entras (nadie mete nada) → intransitivo 入る: 入って ください.\n入れて requiere objeto: にもつを 入れて ください.'},
{id:'j18',c:'jita',q:'この かみを はこに（　）ください。',o:['いれて','はいって','いれ','いれます'],x:'かみを + はこに → transitivo 入れる en forma て: いれて.\nEstructura completa: Xに Yを 入れる.'},
{id:'j19',c:'jita',q:'あ、ドアが（　）。だれが しめましたか。',o:['しまりました','しめました','しめて','しまって'],x:'ドアが (sin agente visible) → intransitivo 閉まる: しまりました.\nLa 2ª oración usa しめました porque ahí sí hay agente (だれが).'},
{id:'j20',c:'jita',q:'でんき（　）きえています。',o:['が','を','で','に'],x:'消える (intransitivo) → el sujeto lleva が.\nを solo con 消す: でんきを けします.'},
{id:'j21',c:'jita',q:'まど（　）あけます。',o:['を','が','で','に'],x:'開ける (transitivo) → objeto con を.\nが solo con 開く: まどが あきます.'},
{id:'j22',c:'jita',q:'じゅぎょう（　）はじまります。',o:['が','を','で','に'],x:'始まる (intransitivo) → が.\nを solo con 始める.'},
{id:'j23',c:'jita',q:'エアコンを（　）ましょうか。',o:['つけ','つき','つけて','ついて'],x:'エアコンを → つける; 〜ましょう pide la raíz ます: つけましょう.\nつきましょう no tiene sentido: つく no admite を.'},
{id:'j24',c:'jita',q:'かいぎを ３{時|じ}に（　）ましょう。',o:['はじめ','はじまり','はじめて','はじまって'],x:'かいぎを → transitivo 始める; raíz + ましょう: はじめましょう.\nはじまり + ましょう es imposible con を.'},
{id:'j25',c:'jita',q:'かぎが（　）いますから、{入|はい}れません。',o:['しまって','しめて','あいて','あけて'],x:'かぎが + ている = estado: está cerrado con llave → しまっています.\nOjo: 入れません aquí = "no puedo entrar" (potencial de 入る).'},
{id:'j26',c:'jita',q:'まいばん おふろに（　）から、ねます。',o:['はいって','いれて','はいり','いれ'],x:'おふろに 入る = bañarse (tú entras) → intransitivo, forma て + から.\nいれて necesitaría un objeto con を.'},

/* ===== Formas y tiempo ===== */
{id:'m01',c:'morph',q:'この ペンで（　）ください。',o:['かいて','かきます','かき','かいた'],x:'ください se une SIEMPRE a la forma て: 書く → 書いて.\nます + ください no existe: es tu patrón del 6 oct.'},
{id:'m02',c:'morph',q:'きのう あさごはんを（　）。',o:['たべませんでした','たべません','たべない','たべて'],x:'きのう fija el pasado → 〜ませんでした.\nたべません es presente/futuro: choca con el marcador de tiempo.'},
{id:'m03',c:'morph',q:'あした ともだちと えいがを（　）。',o:['みます','みました','みて','みませんでした'],x:'あした → no-pasado 〜ます.\nEl marcador de tiempo decide la forma antes que nada.'},
{id:'m04',c:'morph',q:'この へやは（　）です。',o:['しずか','しずかな','しずかい','しずかの'],x:'な-adjetivo ante です va SIN な: しずかです.\nな solo aparece antes de un sustantivo: しずかな へや.'},
{id:'m05',c:'morph',q:'（　）へやですね。',o:['しずかな','しずか','しずかい','しずかの'],x:'な-adjetivo + sustantivo → necesita な: しずかな へや.\nSin sustantivo detrás (しずかです) la な desaparece.'},
{id:'m06',c:'morph',q:'きのうは とても（　）。',o:['さむかったです','さむいでした','さむかったでした','さむくでした'],x:'い-adj en pasado: quita い + かったです.\nさむいでした es el error típico: en い-adj です nunca se conjuga (Sistema 2).'},
{id:'m07',c:'morph',q:'この カレーは あまり（　）。',o:['からくないです','からいじゃないです','からいないです','からくないでした'],x:'い-adj negativo: い → くないです.\nじゃない es para な-adj y sustantivos.'},
{id:'m08',c:'morph',q:'わたしの まちは あまり（　）。',o:['べんりじゃありません','べんりくないです','べんりないです','べんりくありません'],x:'べんり es な-adj (no termina en い) → じゃありません.\nくない solo sirve a い-adjetivos.'},
{id:'m09',c:'morph',q:'へやは あまり（　）。',o:['きれいじゃありません','きれくないです','きれいくないです','きれいないです'],x:'きれい termina en い pero es な-adj (excepción) → じゃありません.\nMismas trampas: ゆうめい, きらい.'},
{id:'m10',c:'morph',q:'せんしゅうの テストは（　）。',o:['むずかしかったです','むずかしいでした','むずかしかったでした','むずかしくでした'],x:'い-adj pasado: むずかしい → むずかしかったです.\nです queda fija; el pasado vive en かった.'},
{id:'m11',c:'morph',q:'いま {雨|あめ}が（　）。',o:['ふっています','ふります','ふりませんでした','ふって'],x:'いま + acción en curso → 〜ています.\nふります = llueve (habitual/futuro), no "está lloviendo ahora".'},
{id:'m12',c:'morph',q:'あには いま とうきょうに（　）。',o:['すんでいます','すみます','すんで','すみませんでした'],x:'住む = "vivir en" se usa en 〜ています (estado actual).\nすみます sugiere "me mudaré a vivir" (cambio futuro).'},
{id:'m13',c:'morph',q:'わたしは {日本|にほん}へ（　）です。',o:['いきたい','いくたい','いってたい','いきほしい'],x:'たい se une a la raíz ます: いき + たい.\nほしい es para OBJETOS (〜が ほしい), no para acciones.'},
{id:'m14',c:'morph',q:'わたしは あたらしい くるまが（　）。',o:['ほしいです','したいです','ほしいます','ほしでした'],x:'Querer un objeto → 〜が ほしいです (ほしい es い-adj).\nしたい es para acciones (べんきょうしたい).'},
{id:'m15',c:'morph',q:'あしたは やすみですから、はやく おき（　）も いいです。',o:['なくて','なかって','なくては','ない'],x:'〜なくても いい = no hace falta. Forma: ない → なくて + も.\nnai-forma en て siempre es なくて (como い-adj: ない → なくて).'},
{id:'m16',c:'morph',q:'あしたまでに しゅくだいを（　）なりません。',o:['しなければ','しないで','しなくても','しても'],x:'〜なければ なりません = tener que (obligación).\nしなくても(いい) es lo opuesto: no hace falta.'},
{id:'m17',c:'morph',q:'ここで たばこを（　）ください。',o:['すわないで','すわなくて','すわない','すわなかった'],x:'Pedir que NO se haga algo → 〜ないで ください.\nなくて no se une a ください.'},
{id:'m18',c:'morph',q:'きのう どこへ（　）か。',o:['いきました','いきます','いって','いく'],x:'きのう → pasado: いきましたか.\nPrimero mira el marcador de tiempo, después el verbo.'},
{id:'m19',c:'morph',q:'{父|ちち}は いま テレビを（　）。',o:['みています','みましょう','みませんでした','みて'],x:'いま + acción en progreso → 〜ています.\nみましょう es invitación ("veamos"), no describe a otra persona.'},
{id:'m20',c:'morph',q:'{山田|やまだ}さんを（　）か。',o:['しっています','しります','しって','しりて'],x:'知る = "saber/conocer" se usa como estado: しっています.\nOjo: el negativo es しりません (sin ている).'},
{id:'m21',c:'morph',q:'この {本|ほん}は（　）、やすいです。',o:['おもしろくて','おもしろいで','おもしろくで','おもしろいて'],x:'Unir い-adj a otra idea: い → くて.\nな-adj usa で: しずかで、きれいです.'},
{id:'m22',c:'morph',q:'この まちは（　）、にぎやかです。',o:['きれいで','きれくて','きれいくて','きれいな'],x:'きれい es な-adj → se une con で: きれいで.\nくて es solo para い-adj de verdad.'},
{id:'m23',c:'morph',q:'にわに いぬが（　）。',o:['います','あります','いります','あるます'],x:'Ser vivo que se mueve (persona/animal) → います.\nあります es para objetos y plantas.'},
{id:'m24',c:'morph',q:'つくえの {上|うえ}に じしょが（　）。',o:['あります','います','ありです','いるます'],x:'Objeto inanimado → あります.\nいます solo para seres vivos que se mueven.'},
{id:'m25',c:'morph',q:'A「きのう なにを しましたか。」 B「テニスを（　）。」',o:['しました','します','して','しません'],x:'Pregunta en pasado → respuesta en pasado.\nTu patrón del 11 ago: contestar en presente a pregunta en pasado.'},
{id:'m26',c:'morph',q:'この ペンを（　）も いいですか。',o:['つかって','つかいます','つかう','つかい'],x:'Pedir permiso: forma て + も いいですか → つかって.\nつかう → つかって (う/つ/る → って).'},

/* ===== Paráfrasis — Sección II ===== */
{id:'s01',c:'syn',q:'わたしは くだものが すきです。',o:['わたしは りんごや バナナが すきです。','わたしは にくや さかなが すきです。','わたしは ジュースや おちゃが すきです。','わたしは パンや ケーキが すきです。'],x:'くだもの = fruta (りんご, バナナ, みかん).\nにく/さかな = proteína; のみもの = bebidas. (Fallo II-1 de tu línea base.)'},
{id:'s02',c:'syn',q:'この もんだいは むずかしいです。',o:['この もんだいは やさしくないです。','この もんだいは かんたんです。','この もんだいは おもしろいです。','この もんだいは ながいです。'],x:'むずかしい = difícil = やさしくない (no es fácil).\nかんたん/やさしい = fácil: es lo contrario. (Fallo II-3.)'},
{id:'s03',c:'syn',q:'あしたは むりです。',o:['あしたは できません。','あしたは できます。','あしたは ひまです。','あしたは だいじょうぶです。'],x:'むり = imposible → できません.\nひま / だいじょうぶ indican que SÍ hay disponibilidad. (Fallo II-4.)'},
{id:'s04',c:'syn',q:'てを あらいました。',o:['てを みずで きれいに しました。','てを あげました。','てを ふきました。','てを けがしました。'],x:'あらう = lavar (con agua) → dejar limpio.\nふく = secar frotando; あげる = levantar. (Fallo II-7.)'},
{id:'s05',c:'syn',q:'しゅくだいは ほとんど おわりました。',o:['しゅくだいは だいたい おわりました。','しゅくだいは ぜんぜん おわっていません。','しゅくだいは すこしだけ おわりました。','しゅくだいは ぜんぶ おわりました。'],x:'ほとんど = casi todo ≈ だいたい.\nぜんぶ = 100%; すこし = poco: ambos cambian la cantidad. (Fallo I-7.)'},
{id:'s06',c:'syn',q:'ともだちを ははに しょうかいしました。',o:['ははに「この ひとは わたしの ともだちです」と いいました。','ともだちに ははの しゃしんを みせました。','ははと ともだちの いえへ いきました。','ともだちに ははの なまえを ききました。'],x:'しょうかいする = presentar a alguien (decir quién es).\nXを Yに しょうかいする: X es presentado A Y. (Fallo I-9.)'},

const NUM=['','いち','に','さん','よん','ご','ろく','なな','はち','きゅう','じゅう'];
const GEM={1:'いっ',6:'ろっ',8:'はっ',10:'じゅっ'};
const FW=n=>String(n).replace(/\d/g,d=>'０１２３４５６７８９'[d]);
const fakeGem=n=>GEM[n]||(NUM[n].length>1?NUM[n].slice(0,-1):NUM[n])+'っ';
function ctrReading(c,n){
  if(c==='hon')return GEM[n]?GEM[n]+'ぽん':n===3?'さんぼん':NUM[n]+'ほん';
  if(c==='satsu')return(n===1||n===8||n===10)?GEM[n]+'さつ':NUM[n]+'さつ';
  if(c==='mai')return NUM[n]+'まい';
  return({1:'ひとり',2:'ふたり',4:'よにん'})[n]||NUM[n]+'にん';
}
function ctrWrong(c,n){
  const N=NUM[n],F=fakeGem(n);let a;
  if(c==='hon')a=[N+'ほん',N+'ぼん',N+'ぽん',F+'ぽん',F+'ほん'];
  else if(c==='satsu')a=[N+'さつ',N+'ざつ',F+'さつ',F+'ざつ',N+'っさつ'];
  else if(c==='mai')a=[F+'まい',N+'ばい',N+'ぱい'].concat(n===4?['しまい']:n===9?['くまい']:[]);
  else a=({1:['いちにん','ひとにん','いちり'],2:['ににん','ふたにん','にり'],4:['よんにん','しにん','よったり']})[n]||[N+'じん',F+'にん',N+'り'].concat(n===9?['くにん']:[]);
  const ok=new Set([ctrReading(c,n),'はちほん','はちさつ','しちにん']);
  return shuffle([...new Set(a)].filter(x=>!ok.has(x))).slice(0,3);
}

/* ---------- Utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function rb(s){
  return esc(s)
    .replace(/\{([^|}]+)\|([^}]+)\}/g,(m,k,r)=>S.settings.furi?`<ruby>${k}<rt>${r}</rt></ruby>`:k)
    .replace(/（　）/g,'<span class="blank">（　　）</span>')
    .replace(/\[([^\]]+)\]/g,'<u>$1</u>');
}
const plain=s=>String(s).replace(/\{([^|}]+)\|[^}]+\}/g,'$1').replace(/[\[\]]/g,'');
const strip=h=>h.replace(/<rt>.*?<\/rt>/g,'').replace(/<[^>]+>/g,'').replace(/&amp;/g,'&');
function today(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function daysTo(iso){const t=new Date();t.setHours(0,0,0,0);return Math.round((new Date(iso+'T00:00:00')-t)/864e5)}

/* ---------- Persistencia: registro de eventos ----------
   La fuente de verdad es S.ev (cada respuesta 'a', cada ráfaga 's', snapshot heredado 'b').
   items/buffer/cats/days/sessions/best son DERIVADOS: se reconstruyen reproduciendo los eventos
   en orden (t, i). Así dos dispositivos que practicaron sin conexión se fusionan sin conflictos. */
const LS_KEY='mextRafaga.v1';
const IV=[0,5*60e3,864e5,3*864e5,7*864e5,21*864e5];
const rid=()=>Math.random().toString(36).slice(2,10);
const isPhone=()=>typeof navigator!=='undefined'&&/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);
function fresh(){return{v:2,dev:{id:rid(),name:isPhone()?'Teléfono':'PC'},ev:[],outbox:[],cursor:0,lastSync:0,
  settings:{dur:75,pressure:true,furi:true,theme:'auto',mode:'mix',syncUrl:'',syncKey:''}}}
function derivedReset(s){s.items={};s.buffer={};s.cats={};s.days={};s.sessions=[];s.best={score:0,combo:0}}
function dayOf(t){const d=S.days[today(new Date(t))];return d||(S.days[today(new Date(t))]={n:0,ok:0,s:0})}
// Aplica un evento al estado derivado. Devuelve {freed} para la UI.
function applyEvent(e){
  if(e.k==='a'){
    const it=S.items[e.q]||(S.items[e.q]={n:0,ok:0,box:0,due:0,miss:0}),ok=!!e.o;
    it.n++;if(ok){it.ok++;it.box=Math.min(5,it.box+1)}else{it.miss++;it.box=0}it.due=e.t+IV[it.box];it.last=e.t;
    const cat=catOf(e.q),c=S.cats[cat]||(S.cats[cat]={n:0,ok:0,ms:0,r:[]});
    c.n++;c.ms+=e.ms||0;c.r.push(ok?1:0);if(c.r.length>40)c.r.shift();if(ok)c.ok++;
    const d=dayOf(e.t);d.n++;if(ok)d.ok++;
    const b=S.buffer[e.q];
    if(!ok)S.buffer[e.q]={s:0,f:(b?b.f:0)+1,t:e.t};
    else if(b){b.s++;b.t=e.t;if(b.s>=3){delete S.buffer[e.q];return{freed:true}}}
    return{};
  }
  if(e.k==='s'){
    S.sessions.push({d:e.t,m:e.m,n:e.n,ok:e.ok,score:e.sc,combo:e.cb});
    dayOf(e.t).s++;S.best.score=Math.max(S.best.score,e.sc||0);S.best.combo=Math.max(S.best.combo,e.cb||0);
    return{};
  }
  if(e.k==='b'){ // progreso anterior a la sincronización: se SUMA al de los demás dispositivos
    const p=e.snap||{};
    for(const[k,v]of Object.entries(p.items||{})){const it=S.items[k];
      if(!it)S.items[k]={...v};else{it.n+=v.n;it.ok+=v.ok;it.miss+=v.miss;if((v.last||0)>(it.last||0))Object.assign(it,{box:v.box,due:v.due,last:v.last})}}
    for(const[k,v]of Object.entries(p.buffer||{}))if(!S.buffer[k]||(v.t||0)>(S.buffer[k].t||0))S.buffer[k]={...v};
    for(const[k,v]of Object.entries(p.cats||{})){const c=S.cats[k]||(S.cats[k]={n:0,ok:0,ms:0,r:[]});c.n+=v.n;c.ok+=v.ok;c.ms+=v.ms;c.r=c.r.concat(v.r||[]).slice(-40)}
    for(const[k,v]of Object.entries(p.days||{})){const d=S.days[k]||(S.days[k]={n:0,ok:0,s:0});d.n+=v.n;d.ok+=v.ok;d.s+=v.s||0}
    S.sessions=S.sessions.concat(p.sessions||[]);
    if(p.best){S.best.score=Math.max(S.best.score,p.best.score||0);S.best.combo=Math.max(S.best.combo,p.best.combo||0)}
    return{};
  }
  return{};
}
function evCmp(a,b){return a.t-b.t||(a.i<b.i?-1:a.i>b.i?1:0)}
function rebuild(){derivedReset(S);S.ev.sort(evCmp);for(const e of S.ev)applyEvent(e);S.sessions.sort((a,b)=>a.d-b.d)}
function addLocal(e){e.i=S.dev.id+'-'+e.t.toString(36)+'-'+rid().slice(0,4);e.d=S.dev.id;S.ev.push(e);S.outbox.push(e.i);return applyEvent(e)}
function load(){
  let s=null;try{s=JSON.parse(localStorage.getItem(LS_KEY))}catch(e){}
  const f=fresh();
  if(s&&s.v===2){s.settings=Object.assign(f.settings,s.settings);S=Object.assign(f,s)}
  else{S=f;if(s&&s.v===1){ // migración del formato anterior a un único snapshot 'b'
    Object.assign(S.settings,s.settings||{});
    if(Object.keys(s.items||{}).length){const e={t:1,k:'b',snap:{items:s.items,buffer:s.buffer,cats:s.cats,days:s.days,sessions:s.sessions,best:s.best}};
      e.i=S.dev.id+'-legacy';e.d=S.dev.id;S.ev.push(e);S.outbox.push(e.i)}}}
  rebuild();if(!s||s.v!==2)save();return S;
}
function save(){try{const{items,buffer,cats,days,sessions,best,...p}=S;localStorage.setItem(LS_KEY,JSON.stringify(p))}catch(e){}}
let S=fresh();derivedReset(S);

/* ---------- Sincronización (Worker → D1 → Notion) ----------
   Sin conexión todo funciona: los eventos esperan en S.outbox. Nunca se sincroniza durante una ráfaga. */
let syncState='off',syncBusy=false;
function syncConfigured(){return !!(S.settings.syncUrl&&S.settings.syncKey)}
async function syncNow(manual){
  if(!syncConfigured()){syncState='off';return}
  if(syncBusy||(view==='drill'&&sess&&sess.state!=='end'))return;
  if(typeof navigator!=='undefined'&&navigator.onLine===false){syncState='offline';refreshSync();return}
  syncBusy=true;syncState='busy';refreshSync();
  try{
    let more=true,changed=false,guard=0;
    while(more&&guard++<20){
      const ids=new Set(S.outbox),out=S.ev.filter(e=>ids.has(e.i)).slice(0,1000);
      const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),10000);
      const r=await fetch(S.settings.syncUrl.replace(/\/+$/,'')+'/sync',{method:'POST',signal:ctl.signal,
        headers:{'Authorization':'Bearer '+S.settings.syncKey,'Content-Type':'application/json'},
        body:JSON.stringify({dev:S.dev.id,since:S.cursor,events:out})});
      clearTimeout(to);
      if(r.status===401){syncState='badkey';break}
      if(!r.ok)throw new Error('HTTP '+r.status);
      const res=await r.json(),sent=new Set(out.map(e=>e.i));
      S.outbox=S.outbox.filter(i=>!sent.has(i));
      const have=new Set(S.ev.map(e=>e.i));
      for(const e of res.events||[])if(!have.has(e.i)){S.ev.push(e);have.add(e.i);changed=true}
      S.cursor=res.cursor||S.cursor;more=!!res.more||S.outbox.length>0;
      syncState='ok';S.lastSync=Date.now();
    }
    if(changed&&!(view==='drill'&&sess&&sess.state!=='end'))rebuild();
    save();if(manual)toast(syncState==='ok'?'☁ Sincronizado':'⚠ Clave inválida');
  }catch(err){syncState=(navigator.onLine===false||err.name==='TypeError'||err.name==='AbortError')?'offline':'error';if(manual)toast('No se pudo sincronizar: '+(err.name==='AbortError'?'sin respuesta':err.message))}
  finally{syncBusy=false;if(view!=='drill')render();else refreshSync()}
}
function syncLabel(){
  if(!syncConfigured())return['☁︎ Sin nube','muted'];
  const p=S.outbox.length;
  if(syncState==='busy')return['☁ Sincronizando…',''];
  if(syncState==='offline')return[`○ Sin conexión${p?' · '+p+' pend.':''}`,'warn'];
  if(syncState==='badkey')return['⚠ Clave inválida','bad'];
  if(syncState==='error')return[`⚠ Error de sync${p?' · '+p+' pend.':''}`,'bad'];
  if(p)return[`☁ ${p} pendientes`,'warn'];
  return['☁ Sincronizado','ok'];
}
function refreshSync(){const el=document.getElementById('syncPill');if(el){const[t,c]=syncLabel();el.textContent=t;el.dataset.s=c}}

/* ---------- Generadores: key → pregunta ----------
   s:<id> estático · cc:<i> categoría contador · cp:<c>/<n> lectura contador · kr:<w> leer kanji · kw:<w> escribir kanji */
const BY_ID=Object.fromEntries(BANK.map(b=>[b.id,b]));
const K_BY=Object.fromEntries(K.map(k=>[k.w,k]));
function finalize(q){shuffle(q.opts);q.correct=q.opts.findIndex(o=>o.ok);q.time=CATS[q.cat].t;return q}
function build(key){
  const i=key.indexOf(':'),t=key.slice(0,i),a=key.slice(i+1);
  if(t==='d')return buildLesson(key,a);
  if(t==='w')return buildProd(key,a);
  if(t==='s'){const it=BY_ID[a];return finalize({key,cat:it.c,head:HEADS[it.c],html:rb(it.q),long:it.c==='syn',
    opts:it.o.map((o,j)=>({v:o,h:rb(o),ok:j===0})),x:it.x.split('\n'),w:it.w||{}})}
  if(t==='cc'){
    const [obj,c,place,trap]=OBJ[+a],n=rnd(2,9),people=c==='nin';
    const s=people?`${place} ${obj}が ${FW(n)}（　）います。`:(Math.random()<.5?`${place} ${obj}が ${FW(n)}（　）あります。`:`${obj}を ${FW(n)}（　）かいました。`);
    const w={};for(const k in CTR)if(k!==c)w[k]=(trap&&trap[k])||`${CTR[k].k} es para ${CTR[k].d}: no encaja con ${plain(obj)}.`;
    return finalize({key,cat:'ctr',head:'Elige el contador',html:rb(s),
      opts:Object.keys(CTR).map(k=>({v:k,h:`${CTR[k].k}<span class="muted small">（${CTR[k].r}）</span>`,ok:k===c})),
      x:[`${plain(obj)} → ${CTR[c].d} → ${CTR[c].k}（${CTR[c].r}）.`,'Atajo: 本 = largo · 枚 = plano · 冊 = encuadernado · 人 = personas.'],w});
  }
  if(t==='cp'){
    const [c,ns]=a.split('/'),n=+ns,ok=ctrReading(c,n),[obj,verb]=CP_OBJ[c];
    return finalize({key,cat:'ctr',head:'¿Cómo se lee lo subrayado?',html:rb(`${obj}が [${FW(n)}${CTR[c].k}] ${verb}。`),
      opts:[{v:ok,h:ok,ok:true}].concat(ctrWrong(c,n).map(v=>({v,h:v,ok:false}))),x:[`${FW(n)}${CTR[c].k} → ${ok}.`,CRULE[c]],w:{}});
  }
  const k=K_BY[a];
  if(t==='kr')return finalize({key,cat:'kanji',head:'Lectura de lo subrayado',html:rb(k.s.replace('@','['+k.w+']')),
    opts:[{v:k.r,h:k.r,ok:true}].concat(k.rc.map(v=>({v,h:v,ok:false}))),x:[`${k.w} = ${k.r} (${k.m}).`,k.h],w:{}});
  return finalize({key,cat:'kanji',head:'Kanji correcto para lo subrayado',html:rb(k.s.replace('@','['+k.r+']')),
    opts:[{v:k.w,h:k.w,ok:true}].concat(k.kc.map(v=>({v,h:v,ok:false}))),x:[`${k.r} (${k.m}) se escribe ${k.w}.`,k.h],w:{}});
}
const ALL_KEYS=[].concat(
  BANK.map(b=>'s:'+b.id),
  OBJ.map((o,i)=>'cc:'+i),
  ...Object.keys(CP_NS).map(c=>CP_NS[c].map(n=>`cp:${c}/${n}`)),
  K.map(k=>'kr:'+k.w),K.map(k=>'kw:'+k.w)
);
function catOf(key){const t=key.slice(0,key.indexOf(':'));if(t==='d')return 'dia';if(t==='w')return 'esc';return t==='s'?BY_ID[key.slice(2)].c:(t==='cc'||t==='cp')?'ctr':'kanji'}
function label(key){const q=build(key);return q?strip(q.html).replace(/\s+/g,' ').trim():'(lección ya no disponible)'}
function allKeys(){return ALL_KEYS.concat(lessonKeys(),prodKeys())}

/* ---------- Motor: SRS Leitner + buffer de errores ---------- */
function catRecent(c){const r=(S.cats[c]||{}).r||[];return r.length<5?null:r.reduce((a,b)=>a+b,0)/r.length}
function poolFor(mode){
  const all=allKeys();
  if(mode==='buf')return Object.keys(S.buffer).filter(k=>all.includes(k));
  if(mode==='mix')return all.filter(k=>catOf(k)!=='esc'); // Mezcla = opción múltiple
  if(mode==='prod')return prodKeys();
  if(mode==='top')return topErrores().map(x=>x.k).filter(k=>all.includes(k));
  if(mode.startsWith('prod:'))return prodKeys(mode.slice(5));
  if(mode==='days')return lessonKeys();
  if(mode.startsWith('day:'))return lessonKeys(mode.slice(4));
  return all.filter(k=>catOf(k)===mode);
}
let sess=null;
function pickNext(){
  const due=sess.sched.filter(s=>s.at<=sess.qi).sort((a,b)=>a.at-b.at)[0];
  if(due){sess.sched.splice(sess.sched.indexOf(due),1);return due.key}
  const pool=sess.pool,now=Date.now(),avoid=new Set(sess.recent.slice(-Math.min(6,Math.floor(pool.length/2))));
  const scheduled=new Set(sess.sched.map(s=>s.key));
  let tot=0;const ws=pool.map(k=>{
    if(avoid.has(k)||scheduled.has(k))return 0;
    const acc=catRecent(catOf(k)),wk=1+2*(1-(acc==null?.5:acc)),it=S.items[k];
    const w=!it?1.2*wk:it.due<=now?(it.box===0?4:2)*wk:.25*wk;tot+=w;return w;
  });
  if(tot<=0){const c=pool.filter(k=>k!==sess.recent[sess.recent.length-1]);return (c.length?c:pool)[rnd(0,(c.length?c:pool).length-1)]}
  let r=Math.random()*tot;for(let i=0;i<pool.length;i++){r-=ws[i];if(r<=0&&ws[i]>0)return pool[i]}
  return pool[pool.length-1];
}
function schedule(key,gap){sess.sched=sess.sched.filter(s=>s.key!==key);sess.sched.push({key,at:sess.qi+gap})}

function startSession(mode){
  const pool=poolFor(mode);
  if(!pool.length){toast(mode==='buf'?'Buffer vacío: no tienes errores pendientes 🎉':'Sin reactivos');return}
  S.settings.mode=mode;save();
  const esProd=mode==='prod'||mode.startsWith('prod:');
  sess={prod:esProd,maxQ:esProd?Math.min(8,Math.max(3,pool.length*2)):0,id:rid()+Date.now().toString(36),mode,pool,qi:0,left:S.settings.dur*1000,score:0,combo:0,maxCombo:0,n:0,ok:0,byCat:{},sched:[],recent:[],freed:0,cur:null,state:'q',qEl:0,qLim:0};
  // errores pendientes de esta categoría: se intercalan cada 2 preguntas
  Object.keys(S.buffer).filter(k=>pool.includes(k)).sort(()=>Math.random()-.5).forEach((k,i)=>sess.sched.push({key:k,at:mode==='buf'?i:1+i*2}));
  view='drill';next();
}
function next(){
  let key=pickNext(),q=build(key),guard=0;
  while(!q&&guard++<20){sess.pool=sess.pool.filter(k=>k!==key);sess.sched=sess.sched.filter(s=>s.key!==key);if(!sess.pool.length)return endSession();key=pickNext();q=build(key)}
  sess.recent.push(key);
  sess.cur=q;sess.cur.buf=S.buffer[key]?S.buffer[key].s:null;
  sess.qEl=0;sess.qLim=S.settings.pressure?sess.cur.time*1000*Math.max(.6,1-.04*sess.combo):0;
  sess.state='q';sess.chosen=null;renderDrill();
}
function answer(idx,prod){
  if(!sess||(sess.state!=='q'&&!(prod&&sess.state==='judge')))return;
  const q=sess.cur,ok=prod?prod.ok:idx===q.correct,now=Date.now(),ms=Math.round(sess.qEl);
  sess.state='fb';sess.chosen=prod?(ok?q.correct:-2):idx;sess.qi++;sess.n++;
  const sc=sess.byCat[q.cat]||(sess.byCat[q.cat]={n:0,ok:0});sc.n++;if(ok)sc.ok++;
  const wasBuf=!!S.buffer[q.key];
  // detalle para el instructor: qué salió, qué respondió y cuál era la correcta
  const txt=x=>strip(x.replace(/<u>(.*?)<\/u>/g,'【$1】')).replace(/\s+/g,' ').trim();
  const freed=!!addLocal({t:now,k:'a',q:q.key,o:ok?1:0,ms,sid:sess.id,pr:txt(q.html).slice(0,200),ch:prod?(prod.typed||'(vacío)')+(prod.ok&&!prod.exact?' (válida según yo)':''):idx>=0?txt(q.opts[idx].h):'(se acabó el tiempo)',co:prod?q.ans:txt(q.opts[q.correct].h)}).freed;
  if(!ok){schedule(q.key,rnd(2,3));if(sess.mode==='buf'&&!sess.pool.includes(q.key))sess.pool.push(q.key)}
  else if(freed){sess.freed++;if(sess.mode==='buf')sess.pool=sess.pool.filter(k=>k!==q.key)}
  else if(wasBuf)schedule(q.key,rnd(3,4));
  if(ok){
    sess.ok++;sess.combo++;sess.maxCombo=Math.max(sess.maxCombo,sess.combo);
    const mult=1+Math.min(4,Math.floor(sess.combo/3))*.5,bonus=sess.qLim?Math.round(5*Math.max(0,1-sess.qEl/sess.qLim)):0;
    sess.gain=Math.round(10*mult)+bonus;sess.score+=sess.gain;
  }else{sess.combo=0;sess.gain=0}
  save();vibrate(ok?12:[40,40,40]);
  if(freed)toast('✓ Liberado del buffer: 3 aciertos seguidos');
  renderDrill();
  if(ok){const qi=sess.qi;setTimeout(()=>{if(sess&&sess.state==='fb'&&sess.qi===qi)cont()},380)}
}
function cont(){
  if(!sess||sess.state!=='fb')return;
  if(sess.left<=0||(sess.mode==='buf'&&!sess.pool.length)||(sess.maxQ&&sess.qi>=sess.maxQ))return endSession();
  next();
}
function endSession(){
  if(!sess)return;
  if(sess.n>0){
    sess.record=sess.score>S.best.score;
    const now=new Date(),off=-now.getTimezoneOffset(),pad=n=>String(Math.abs(n)).padStart(2,'0');
    const iso=today(now)+'T'+pad(now.getHours())+':'+pad(now.getMinutes())+':'+pad(now.getSeconds())+(off>=0?'+':'-')+pad(Math.trunc(off/60))+':'+pad(off%60);
    const by={};for(const c in sess.byCat)by[c]=[sess.byCat[c].ok,sess.byCat[c].n];
    addLocal({t:now.getTime(),k:'s',sid:sess.id,m:sess.mode,mn:modeLabel(sess.mode),n:sess.n,ok:sess.ok,sc:sess.score,cb:sess.maxCombo,fr:sess.freed,bc:Object.keys(S.buffer).length,by,iso,dn:S.dev.name});
    save();
  }
  sess.state='end';view='end';render();
  syncNow();
}
function vibrate(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}

/* ---------- Bucle de tiempo ---------- */
let lastT=0;
const RC=2*Math.PI*20; // circunferencia del anillo del temporizador (r=20)
function tick(t){
  const dt=Math.min(100,t-(lastT||t));lastT=t;
  if(view==='drill'&&sess&&sess.state==='q'&&!document.hidden){
    if(!sess.prod)sess.left=Math.max(0,sess.left-dt);sess.qEl+=dt;
    if(sess.qLim&&sess.qEl>=sess.qLim)answer(-1);
    updateClock();
  }
  requestAnimationFrame(tick);
}
function updateClock(){
  const fg=$('#tfg'),tx=$('#ttx'),tr=$('#tring'),qt=$('#qt'),lt=$('#lastTag');
  const f=sess.left/(S.settings.dur*1000);
  if(fg)fg.style.strokeDashoffset=RC*(1-f);
  if(tx)tx.textContent=Math.ceil(sess.left/1000);
  if(tr)tr.classList.toggle('low',sess.left<10000);
  if(qt){const p=sess.qLim&&sess.state==='q'?Math.max(0,1-sess.qEl/sess.qLim):0;qt.style.width=(100*p)+'%';qt.className=p<.25?'low':p<.5?'mid':''}
  if(lt&&sess.left<=0)lt.classList.remove('hide');
}

    <div class="card"><h3>Más fallados</h3>${miss.length?`<ul class="list">${miss.map(([k,v])=>`<li>${glyph(catOf(k))}<span class="t" lang="ja">${esc(label(k))}</span><span class="muted small">${v.miss}✗ / ${v.n}</span></li>`).join('')}</ul>`:'<span class="muted">Todavía nada.</span>'}</div>
    <div class="card"><h3>Últimas ráfagas</h3>${ss.length?`<ul class="list">${ss.map(s=>`<li>${glyph(s.m)}<span class="t">${new Date(s.d).toLocaleString('es',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</span><span class="muted small">${s.ok}/${s.n} · <b style="color:var(--text)">${s.score}</b></span></li>`).join('')}</ul>`:'<span class="muted">Sin sesiones.</span>'}</div>
  </div>`;
}
let lastView=null,lastOpen=null;
function render(){applyTheme();const y=window.scrollY;if(view==='tabla')return renderTablaDia();if(view==='home')renderHome();else if(view==='drill')renderDrill();else if(view==='end')renderEnd();else if(view==='estudio')renderEstudio();else if(view==='sesion')renderSesion();else if(view==='prog')renderProg();else if(view==='simu')renderSimHoja();else renderStats();
  if(view!=='drill'&&(view!==lastView||eOpen!==lastOpen))window.scrollTo(0,0);else if(view==='sesion'||view==='estudio')window.scrollTo(0,y);lastView=view;lastOpen=eOpen;ladoPintar();tocPintar()}

/* =========================================================
   ESTUDIO DIARIO CON EL INSTRUCTOR (solo japonés)
   Sección aparte del juego: sin puntos ni rachas. El instructor escribe la sesión
   en Notion → el Worker la entrega → aquí se resuelve, se cronometra y se entrega.
   Almacenamiento propio: 'mextRafaga.estudio.v1'.
   ========================================================= */
const E_KEY='mextRafaga.estudio.v1';
let E={ses:{},work:{},outbox:[],lastFetch:0};
let eState='off',eBusy=false,eOpen=null; // eOpen = id de la sesión abierta
function eLoad(){try{const d=JSON.parse(localStorage.getItem(E_KEY));if(d&&d.ses)E=Object.assign({ses:{},work:{},outbox:[],lastFetch:0},d)}catch(e){}
  // Versiones anteriores podían marcar como «al día» sesiones que solo bajaron a medias:
  // se olvidan esas marcas una vez para volver a descargar todo (se conserva lo guardado mientras tanto).
  if((E.cv||0)<2){for(const s of Object.values(E.ses))s.edited=null;E.cv=2;eSave()}
  if(E.cv<3){const now=Date.now();for(const[sid,w]of Object.entries(E.work)){if(w.sent)continue;
    for(const[it,a]of Object.entries(w.ans)){a.t=a.t||now;bMark(sid,'a:'+it)}for(const[sec,tm]of Object.entries(w.tim)){tm.t=tm.t||now;bMark(sid,'t:'+sec)}}E.cv=3;eSave()}}
function eSave(){try{localStorage.setItem(E_KEY,JSON.stringify(E))}catch(e){}}
const eWork=id=>E.work[id]||(E.work[id]={ans:{},tim:{},sent:null});

/* ---------- Lectura del formato del instructor ---------- */
const E_MARKS=[[/^🎙|^🎤/,'tarea'],[/^📘/,'consulta'],[/^✍️|^✍/,'tarea'],[/^⚡/,'practica'],[/^✅/,'fuera'],[/^🧑‍🏫|^👨‍🏫|^👩‍🏫/,'feedback'],[/^📤/,'entrega'],[/^🎮/,'juego'],[/^🔍.*correcci[oó]n/i,'correccion'],[/^🔍/,'tarea']]; // 🔍 sin «Corrección» (p. ej. «🔍 Análisis de errores») es una actividad
const E_LABEL={oral:'🎙️ Speaking',consulta:'📘 Consulta',tarea:'✍️ Tarea',practica:'⚡ Práctica',fuera:'✅ Fuera de la app',feedback:'🧑‍🏫 Retroalimentación'};
const ptxt=rt=>(rt||[]).map(r=>r.t).join('');
function eParse(blocks){
  const out={intro:[],secs:[],feedback:[],corr:[]};let cur=null;
  for(const b of blocks||[]){
    if(b.type==='heading_1'||b.type==='heading_2'){
      const text=ptxt(b.rt).trim(),mk=E_MARKS.find(([re])=>re.test(text));
      const kind=mk?mk[1]:'texto';
      let title=text.replace(/^(\p{Extended_Pictographic}|️|‍|\s)+/u,'');
      title=title.replace(/^(Consulta|Tarea|Práctica|Practica|Fuera de la app|Retroalimentación|Entrega|Speaking|Oral|Producción oral)\s*[:：]?\s*/i,'');
      const mm=title.match(/\s*[·\-–(]\s*(\d+)\s*min\)?\s*$/i);
      if(mm)title=title.slice(0,mm.index).trim();
      cur={id:b.id,kind,title,min:mm?+mm[1]:null,blocks:[],items:[],head:text,oral:/^(🎙|🎤)/u.test(text)};
      if(kind==='feedback')out.feedback.push(cur);else if(kind==='correccion')out.corr.push(cur);else out.secs.push(cur);
      continue;
    }
    if(!cur){out.intro.push(b);continue}
    const interactive=cur.kind==='tarea'||cur.kind==='practica'||cur.kind==='fuera'||cur.kind==='juego';
    const isItem=interactive&&(b.type==='numbered_list_item'||b.type==='bulleted_list_item'||b.type==='to_do');
    if(isItem){cur.items.push(b);cur.blocks.push({type:'_item',idx:cur.items.length-1})}else cur.blocks.push(b);
  }
  return out;
}

/* ---------- Render de bloques (seguro: todo se escapa) ---------- */
function eRich(rt){
  return (rt||[]).map(r=>{let s=esc(r.t).replace(/\n/g,'<br>');
    if(r.c)s=`<code>${s}</code>`;if(r.b)s=`<b>${s}</b>`;if(r.i)s=`<i>${s}</i>`;if(r.s)s=`<s>${s}</s>`;if(r.u)s=`<u class="eu">${s}</u>`;
    if(r.h&&/^https?:\/\//.test(r.h))s=`<a href="${esc(r.h)}" target="_blank" rel="noopener">${s}</a>`;return s}).join('');
}
function eBlocks(list){
  let h='',i=0;
  while(i<list.length){
    const b=list[i];
    if(b.type==='bulleted_list_item'||b.type==='numbered_list_item'){
      const tag=b.type==='bulleted_list_item'?'ul':'ol';let li='';
      while(i<list.length&&list[i].type===b.type){li+=`<li>${eRich(list[i].rt)}${list[i].kids?eBlocks(list[i].kids):''}</li>`;i++}
      h+=`<${tag}>${li}</${tag}>`;continue;
    }
    switch(b.type){
      case 'paragraph':h+=b.rt&&b.rt.length?`<p>${eRich(b.rt)}</p>`:'';break;
      case 'heading_1':case 'heading_2':case 'heading_3':h+=`<h4>${eRich(b.rt)}</h4>`;break;
      case 'to_do':h+=`<p>${b.checked?'☑':'☐'} ${eRich(b.rt)}</p>`;break;
      case 'quote':h+=`<blockquote>${eRich(b.rt)}</blockquote>`;break;
      case 'callout':h+=`<div class="ecall"><span>${esc(b.icon||'💡')}</span><div>${eRich(b.rt)}${b.kids?eBlocks(b.kids):''}</div></div>`;break;
      case 'code':h+=`<pre lang="ja">${esc(ptxt(b.rt))}</pre>`;break;
      case 'divider':h+='<hr>';break;
      case 'toggle':h+=`<details><summary>${eRich(b.rt)}</summary>${b.kids?eBlocks(b.kids):''}</details>`;break;
      case 'table':{const rows=b.kids||[],on=b.id&&ladoOn(b.id);h+=`<div class="etw${b.id&&!eBlocks.sinPin?' epinw':''}">${b.id&&!eBlocks.sinPin?`<button class="epin${on?' on':''}" data-e="lado" data-id="${esc(b.id)}" title="${on?'Quitar del lado izquierdo':'Fijar a la izquierda de la pantalla'}" aria-label="Fijar tabla">📌</button>`:''}<table>${rows.map((r,ri)=>`<tr>${(r.cells||[]).map(c=>ri===0&&b.header?`<th>${eRich(c)}</th>`:`<td>${eRich(c)}</td>`).join('')}</tr>`).join('')}</table></div>`;break}
      default:if(b.rt&&b.rt.length)h+=`<p>${eRich(b.rt)}</p>`;
    }
    if(b.kids&&!['toggle','callout','table'].includes(b.type))h+=`<div class="ekids">${eBlocks(b.kids)}</div>`;
    i++;
  }
  return h;
}

/* ---------- Cronómetros: guardan la hora de inicio, sobreviven al cierre ---------- */
const eMs=t=>t?(t.acc||0)+(t.start?Date.now()-t.start:0):0;
const eFmt=ms=>{const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(ss).padStart(2,'0')};
function eRunning(w){for(const[k,t]of Object.entries(w.tim))if(t.start)return k;return null}
function eToggle(id,sec){
  const w=eWork(id),now=Date.now(),run=eRunning(w);
  if(run){const t=w.tim[run];t.acc=(t.acc||0)+now-t.start;t.start=null;t.t=now;bMark(id,'t:'+run)}
  if(run!==sec){const t=w.tim[sec]||(w.tim[sec]={acc:0,start:null});t.start=now;t.t=now;bMark(id,'t:'+sec)}
  eSave();bSoon(1000);
}
/* Cronómetro automático: al escribir o elegir una respuesta en una sección, su cronómetro arranca solo
   (y el de la sección anterior se detiene). Sin re-dibujar la pantalla, para no perder el foco. */
function eAutoTimer(el){
  if(view!=='sesion'||!eOpen||!el||!el.closest)return;const w=eWork(eOpen);if(w.sent)return;
  const btn=el.closest('section')?.querySelector('[data-e="timer"]');if(!btn||btn.disabled)return;
  const sec=btn.dataset.sec;if(eRunning(w)===sec)return;
  eToggle(eOpen,sec);
  document.querySelectorAll('[data-e="timer"]').forEach(b=>{const on=eRunning(w)===b.dataset.sec;b.classList.toggle('on',on);if(b.firstChild&&b.firstChild.nodeType===3)b.firstChild.nodeValue=(on?'⏸':'▶')+' '});
}
function eStopAll(w){const run=eRunning(w);if(run){const t=w.tim[run];t.acc=(t.acc||0)+Date.now()-t.start;t.start=null}}
function eTick(){
  if(view==='simu'){const el=document.getElementById('simT');if(el&&E.sim&&E.sim.start)el.textContent=eFmt(Date.now()-E.sim.start);return}
  if(view!=='sesion'||!eOpen)return;const w=eWork(eOpen);let total=0;
  document.querySelectorAll('[data-tm]').forEach(el=>{const ms=eMs(w.tim[el.dataset.tm]);el.textContent=eFmt(ms)});
  for(const t of Object.values(w.tim))total+=eMs(t);
  const tt=document.getElementById('eTotal');if(tt)tt.textContent=eFmt(total);
}

/* ---------- Sincronización con el Worker ---------- */
function eHeaders(){return{'Authorization':'Bearer '+S.settings.syncKey,'Content-Type':'application/json'}}
const eUrl=p=>S.settings.syncUrl.replace(/\/+$/,'')+p;
async function ePost(p,body){
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),45000); // el Worker espacia las consultas a Notion
  try{const r=await fetch(eUrl(p),{method:'POST',headers:eHeaders(),body:JSON.stringify(body),signal:ctl.signal});
    if(r.status===401)throw Object.assign(new Error('Clave inválida'),{badkey:1});
    if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||('HTTP '+r.status));return r.json()}
  finally{clearTimeout(to)}
}
/* Borradores: la sesión a medias se copia sola al otro dispositivo (y viceversa).
   Cada respuesta y cada cronómetro viaja por separado con su hora de edición; gana la más reciente. */
// Cola en segundo plano: si no hay conexión, el service worker la manda sola al volver la señal
// aunque la app esté cerrada (Background Sync, Android). Sin ese soporte, se manda al abrir la app.
function bgCola(clave,ruta,body){try{
  const r=indexedDB.open('mext-bg',1);r.onupgradeneeded=()=>r.result.createObjectStore('q');
  r.onsuccess=()=>{const db=r.result,t=db.transaction('q','readwrite');t.objectStore('q').put({url:eUrl(ruta),headers:eHeaders(),body:JSON.stringify(body)},clave);
    t.oncomplete=()=>{db.close();navigator.serviceWorker&&navigator.serviceWorker.ready.then(g=>g.sync&&g.sync.register('mext-bg')).catch(()=>{})}};
}catch(e){}}
function bMark(sid,k){(E.bq||(E.bq={}))[sid+'|'+k]=1}
function bCorriendo(){const now=Date.now();for(const[sid,w]of Object.entries(E.work)){if(w.sent)continue;const run=eRunning(w);if(run){w.tim[run].t=now;bMark(sid,'t:'+run)}}}
let bT=null,bBusy=false;
function bSoon(ms){clearTimeout(bT);bT=setTimeout(bSync,ms)}
function bVal(sid,k){if(sid==='_pins'){const p=(E.pins||{})[k.slice(2)];return p?{t:p.t,v:{on:!!p.on}}:null}
  const w=E.work[sid];if(!w)return null;
  if(k.startsWith('a:')){const a=w.ans[k.slice(2)];return a?{t:a.t||0,v:{r:a.r||'',duda:!!a.duda,nota:a.nota||'',hecho:!!a.hecho}}:null}
  const tm=w.tim[k.slice(2)];return tm?{t:tm.t||0,v:{acc:eMs(tm)}}:null}
async function bSync(keepalive){
  if(!syncConfigured()||bBusy)return;
  if(navigator.onLine===false&&!keepalive)return;
  const claves=Object.keys(E.bq||{}),push=[];
  const enviado={};
  for(const c of claves){const i=c.indexOf('|'),s=c.slice(0,i),k=c.slice(i+1),x=bVal(s,k);enviado[c]=x&&x.t;if(x&&!(E.work[s]&&E.work[s].sent))push.push({s,k,t:x.t,v:x.v})}
  const body={push,since:E.bc||0,dev:S.dev.id};
  if(keepalive){if(push.length){bgCola('borr:'+Date.now(),'/estudio/borrador',{push,since:0,dev:S.dev.id});
    if(navigator.onLine!==false)try{fetch(eUrl('/estudio/borrador'),{method:'POST',headers:eHeaders(),body:JSON.stringify(body),keepalive:true})}catch(e){}}return}
  bBusy=true;
  try{let r,guard=0;
    do{r=await ePost('/estudio/borrador',body);body.push=[];
      for(const c of claves){const i=c.indexOf('|'),x=bVal(c.slice(0,i),c.slice(i+1));if(E.bq&&(!x||x.t===enviado[c]))delete E.bq[c]} // lo que editaste mientras tanto se manda en la próxima
      bAplicar(r.rows||[]);E.bc=body.since=r.cursor;eSave()}while(r.more&&++guard<20);
  }catch(e){}finally{bBusy=false}
}
function bAplicar(rows){
  const tocadas=new Set();let pins=false;
  for(const x of rows){
    if(x.s==='_pins'){const id=x.k.slice(2),p=(E.pins||(E.pins={}))[id];if(!x.v||(p&&p.t>=x.t))continue;E.pins[id]={on:!!x.v.on,t:x.t};pins=true;continue}
    const w=eWork(x.s);if(w.sent||!x.v)continue;
    if(x.k.startsWith('a:')){const it=x.k.slice(2),a=w.ans[it];if(a&&(a.t||0)>=x.t)continue;
      w.ans[it]=Object.assign({},x.v,{t:x.t});tocadas.add(x.s+'|'+it)}
    else{const sec=x.k.slice(2),tm=w.tim[sec];if(tm&&(tm.t||0)>=x.t)continue;
      w.tim[sec]={acc:x.v.acc||0,start:null,t:x.t};tocadas.add(x.s+'|')}
  }
  if(pins){eSave();if((view==='estudio'&&eSub==='mat')||view==='tabla')render()}
  if(!tocadas.size)return;eSave();
  if(view!=='sesion'||!eOpen||![...tocadas].some(c=>c.startsWith(eOpen+'|')))return;
  const foco=document.activeElement;
  if(!(foco&&foco.matches('input,textarea'))){render();return}
  // Estás escribiendo: se actualizan los demás campos sin tocar el que tienes abierto
  const w=E.work[eOpen];
  document.querySelectorAll('[data-it][data-a]').forEach(el=>{if(el===foco)return;const a=w.ans[el.dataset.it];if(!a)return;
    const v=a[el.dataset.a];if(el.type==='checkbox')el.checked=!!v;else if(v!=null&&el.value!==v)el.value=v});
}
async function eSync(manual){
  if(!syncConfigured()){eState='off';eRefresh();return}
  if(eBusy)return;
  if(navigator.onLine===false){eState='offline';eRefresh();return}
  eBusy=true;eState='busy';eRefresh();
  try{
    while(E.outbox.length){await ePost('/estudio/entrega',E.outbox[0]);E.outbox.shift();eSave()}
    while((E.simOut||[]).length){await ePost('/simulacro/entrega',E.simOut[0]);E.simOut.shift();eSave()}
    try{const rs=await ePost('/simulacro/lista',{});E.sims=rs.simulacros||[];eSave()}catch(e){if(e.badkey)throw e} // sin base de simulacros configurada: se ignora
    try{const rt=await ePost('/temas/lista',{});E.temas=rt.temas||[];eSave()}catch(e){if(e.badkey)throw e}
    // El Worker baja las sesiones por partes (límite de consultas): repetimos mientras diga 'more'
    let r,guard=0;const ronda=rid()+Date.now().toString(36); // misma ronda en todas las vueltas
    do{
      const known={};for(const s of Object.values(E.ses))if(s.blocks&&s.edited)known[s.id]=s.edited;
      r=await ePost('/estudio/lista',{known,ronda,fresh:!!manual});
      const parcial={...E.ses};
      for(const s of r.sesiones||[]){const old=E.ses[s.id];
        // si quedó pendiente, conserva lo guardado y su fecha de edición para volver a pedirla
        parcial[s.id]=s.blocks?{...s}:{...s,blocks:old&&old.blocks||null,edited:old&&old.blocks?old.edited:null}}
      E.ses=parcial;eSave();if(r.more&&view==='estudio')eRefresh();
    }while(r.more&&++guard<30);
    const next={};
    for(const s of r.sesiones||[])next[s.id]=E.ses[s.id];
    const oldest=(r.sesiones||[]).reduce((m,s)=>!m||s.fecha<m?s.fecha:m,'');
    // Si el instructor borró una sesión en Notion, se quita también aquí. Solo se conserva lo que aún no
    // llegó a Notion (respuestas sin entregar o una entrega en cola) y lo antiguo que ya no entra en la lista.
    const enCola=new Set(E.outbox.map(o=>o.page));
    for(const[id,s]of Object.entries(E.ses)){if(next[id])continue;const w=E.work[id];
      const sinEntregar=w&&!w.sent&&Object.keys(w.ans||{}).length;
      if(sinEntregar||enCola.has(id)||(r.sesiones||[]).length>=40&&s.fecha<oldest)next[id]=s}
    E.ses=next;E.lastFetch=Date.now();eState='ok';eSave();
    if(manual)toast('Sesiones actualizadas');
  }catch(err){eState=err.badkey?'badkey':(navigator.onLine===false||err.name==='TypeError'||err.name==='AbortError')?'offline':'error';eErr=err.message;if(manual)toast(eState==='offline'?'Sin conexión: se usará lo guardado':'No se pudo actualizar: '+err.message)}
  finally{eBusy=false;const typing=document.activeElement&&document.activeElement.matches('textarea,input');if(view==='estudio'||view==='tabla'||((view==='home'||view==='sesion')&&!typing))render();else eRefresh()}
}
let eErr='';
function eStatus(){
  if(!syncConfigured())return['Sin conexión configurada · configura la nube en Ajustes del juego','warn'];
  const nq=E.outbox.length+((E.simOut||[]).length),p=nq?` · ${nq} entrega(s) en cola`:'';
  if(eState==='busy')return['Actualizando…',''];
  if(eState==='offline')return['Sin conexión · usando lo guardado'+p,'warn'];
  if(eState==='badkey')return['Clave inválida (revisa Ajustes del juego)','bad'];
  if(eState==='error')return['Error al actualizar: '+eErr+p,'bad'];
  return[(E.lastFetch?'Actualizado '+new Date(E.lastFetch).toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'}):'Sin actualizar')+p,'ok'];
}
function eRefresh(){const el=document.getElementById('eStat');if(el){const[t,c]=eStatus();el.textContent=t;el.dataset.s=c}}

/* ---------- Vistas ---------- */
const eFecha=f=>new Date(f+'T12:00:00').toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'});
const E_CHIP={Publicada:'Por hacer',Entregada:'Entregada',Corregida:'Corregida'};
function eChip(s){const w=E.work[s.id],st=w&&w.sent&&s.estado==='Publicada'?'Entregada':s.estado;return `<span class="echips"><span class="echip" data-st="${esc(st)}">${esc(E_CHIP[st]||st)}${w&&w.sent&&E.outbox.some(o=>o.page===s.id)?' · en cola':''}</span>${eNota(s)}</span>`}
// Calificación 1–10 que pone el instructor: solo una referencia, la app no la usa para nada
// Color de una nota: rojo < 7 · amarillo 7–8,5 · verde > 8,5
const notaNivel=v=>v>8.5?'a':v>=7?'b':'c',notaColor=v=>({a:'var(--ok)',b:'var(--amar)',c:'var(--bad)'})[notaNivel(v)];
function eNota(s){
  if(typeof s.nota!=='number'||s.nota<0)return'';
  const v=Math.min(10,Math.round(s.nota*10)/10);
  return `<span class="enota" data-n="${notaNivel(v)}" title="Calificación del instructor (referencia)">${String(v).replace('.',',')}/10</span>`;
}
function tabsHtml(on){return `<nav class="tabs" role="tablist"><button role="tab" aria-selected="${on==='juego'}" data-e="tab-juego" class="${on==='juego'?'on':''}">🎮 Juego</button><button role="tab" aria-selected="${on==='estudio'}" data-e="tab-estudio" class="${on==='estudio'?'on':''}">📝 Estudio</button></nav>`}
let eSub='ses';
function renderEstudio(){
  if(eSub==='ref')return renderRef();
  if(eSub==='mat')return renderMateria();
  if(eSub==='sim')return renderSimLista();
  if(eSub==='tem')return renderTemas();

/* ---------- Dominio de la fase (lo escribe el instructor en Notion) ---------- */
function eDominio(){
  let best=null;
  for(const s of Object.values(E.ses)){
    if(typeof s.dominio!=='number')continue;
    if(!best||s.fecha>best.fecha||(s.fecha===best.fecha&&(s.edited||'')>(best.edited||'')))best=s;
  }
  if(!best)return null;
  let v=best.dominio;if(v>0&&v<1)v*=100; // por si lo escribió como 0.42
  return{fase:best.fase||'Fase',v:Math.max(0,Math.min(100,Math.round(v))),fecha:best.fecha};
}
/* Dominio del tema que se está viendo: también lo escribe el instructor (Tema + Dominio tema %) */
function eDomTema(){
  let best=null;
  for(const s of Object.values(E.ses)){
    if(typeof s.domTema!=='number')continue;
    if(!best||s.fecha>best.fecha||(s.fecha===best.fecha&&(s.edited||'')>(best.edited||'')))best=s;
  }
  if(!best)return null;
  let v=best.domTema;if(v>0&&v<1)v*=100;

}
function temaPill(){

/* Dominio de la fase = temas en 100% ÷ temas de la fase en «🗺️ Temas» (la misma cuenta del instructor).
   El criterio sigue siendo suyo: él decide cuándo un tema llega a 100; la app solo suma.
   Sin lista de temas para esa fase, se usa el «Dominio %» que escribió en la sesión (como antes). */

  let best=null;

function eRitmo(){

/* ---------- Lecciones del juego: sección 🎮 Juego que el instructor agrega al corregir ----------

function lessonItems(s){

      }

    }

let simPdfVer=false;const simPdfImgs={};
function pdfIdb(){return new Promise((ok,no)=>{const r=indexedDB.open('rafaga-pdf',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function pdfGet(id){try{const db=await pdfIdb();return await new Promise(ok=>{const q=db.transaction('f').objectStore('f').get(id);q.onsuccess=()=>ok(q.result||null);q.onerror=()=>ok(null)})}catch(e){return null}}
async function pdfPut(id,blob){const db=await pdfIdb();await new Promise((ok,no)=>{const t=db.transaction('f','readwrite');t.objectStore('f').put(blob,id);t.oncomplete=ok;t.onerror=()=>no(t.error)})}
let pdfLib=null;
function pdfCargarLib(){if(pdfLib)return pdfLib;
  pdfLib=new Promise((ok,no)=>{const sc=document.createElement('script');sc.src='vendor/pdf.min.js';
    sc.onload=()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc='vendor/pdf.worker.min.js';ok(window.pdfjsLib)};
    sc.onerror=()=>{pdfLib=null;no(new Error('no se pudo cargar el lector de PDF'))};document.head.appendChild(sc)});

  setTimeout(()=>simPdfCargar(s.ex),0);return '<div class="muted small" style="padding:10px">Cargando las preguntas…</div>'}
async function simPdfCargar(id,file){const el=document.getElementById('simPdf');if(!el)return;
  const ex=SIM_EX.find(x=>x.id===id)||{};
  try{let blob=file||await pdfGet(id);
    if(!blob){el.innerHTML=`<div style="padding:10px"><p class="muted small">Elige el PDF del examen (${esc(ex.pdf||'el del año '+id)}). Se guarda solo en este dispositivo; la próxima vez se abre solo.</p><label class="btn">Elegir PDF<input type="file" accept="application/pdf,.pdf" data-simpdf="${esc(id)}" hidden></label></div>`;return}
    const lib=await pdfCargarLib(),doc=await lib.getDocument({data:new Uint8Array(await blob.arrayBuffer())}).promise;
    const a=ex.pags?ex.pags[0]:1,b=ex.pags?Math.min(ex.pags[1],doc.numPages):doc.numPages,urls=[];
    if(a>doc.numPages)throw new Error('ese PDF no parece el del examen '+id);
    for(let n=a;n<=b;n++){const pg=await doc.getPage(n),v0=pg.getViewport({scale:1}),v=pg.getViewport({scale:1600/v0.width});

      urls.push(await new Promise(ok=>c.toBlob(x=>ok(URL.createObjectURL(x)),'image/jpeg',.85)))}
    if(file)await pdfPut(id,file);
    simPdfImgs[id]=urls;const el2=document.getElementById('simPdf');if(el2)el2.innerHTML=simPdfHtml(E.sim);
  }catch(err){const el2=document.getElementById('simPdf');if(el2)el2.innerHTML=`<div class="muted small" style="padding:10px">No pude abrir el PDF: ${esc(err.message||String(err))}. Prueba con «Cambiar PDF».</div>`}}

/* 🖼️ Imagen de la tabla del día (1080×2400) para ponerla de fondo de pantalla: así se ve sin abrir nada.
   Se dibuja en un canvas con el texto de las celdas; la letra se achica sola para que quepa. */
async function tablaImagen(){
  const td=tablasDelDia();if(!td.tablas.length)return;const d={s:(td.d||{}).s||{titulo:'Tablas fijadas'},tablas:td.tablas};
  const W=1080,H=2400,cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d');
  const F='"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif';
  g.fillStyle='#10131f';g.fillRect(0,0,W,H);
  const tablas=d.tablas.map(x=>({tema:x.tema,rows:(x.t.kids||[]).map(r=>(r.cells||[]).map(c=>ptxt(c).trim())),head:!!x.t.header}));
  const M=60,ancho=W-2*M;
  // medir: tamaño de letra que hace caber todas las tablas en la mitad inferior (arriba quedan reloj e íconos)
  const medir=fs=>{let h=0;const lay=[];for(const t of tablas){const nc=Math.max(...t.rows.map(r=>r.length),1);g.font=`600 ${fs}px ${F}`;
      const cw=Array(nc).fill(0);for(const r of t.rows)r.forEach((c,i)=>{cw[i]=Math.max(cw[i],g.measureText(c).width+fs*1.2)});
      const tot=cw.reduce((a,b)=>a+b,0);lay.push({t,cw:cw.map(w=>w*ancho/Math.max(tot,1)),ok:tot<=ancho});h+=(t.tema?fs*1.6:0)+t.rows.length*fs*1.75+fs*1.2}
    return{h,lay,ok:lay.every(l=>l.ok)}};
  let fs=46,m=medir(fs);while(fs>18&&(!m.ok||m.h>H*0.62)){fs-=2;m=medir(fs)}
  let y=Math.max(H*0.3,H-m.h-200);
  g.fillStyle='#ff6b5e';g.font=`800 ${Math.round(fs*0.8)}px ${F}`;g.fillText('📌 '+(d.s.titulo||'Tabla del día'),M,y-fs*0.9);
  for(const L of m.lay){const t=L.t;
    if(t.tema){g.fillStyle='#9aa3c7';g.font=`700 ${Math.round(fs*0.8)}px ${F}`;g.fillText(t.tema,M,y+fs*0.9);y+=fs*1.6}
    t.rows.forEach((r,ri)=>{const rh=fs*1.75,top=y;
      g.fillStyle=ri===0&&t.head?'#2a3150':ri%2?'#171b2c':'#1c2135';g.fillRect(M,top,ancho,rh);
      let x=M;r.forEach((c,i)=>{g.fillStyle=ri===0&&t.head?'#ffd84d':'#f2efe8';g.font=`${ri===0&&t.head?800:600} ${fs}px ${F}`;g.fillText(c,x+fs*0.6,top+rh*0.68);x+=L.cw[i]});
      y+=rh});
    y+=fs*1.2}
  const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
  const file=new File([blob],'tabla-del-dia.png',{type:'image/png'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Tabla del día'});return}}catch(e){if(e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tabla-del-dia.png';document.body.appendChild(a);a.click();a.remove();
  toast('Imagen guardada: ponla como fondo de pantalla desde tu galería');
}
function materiaDias(){
  const dias=[];
  for(const s of Object.values(E.ses).sort((a,b)=>b.fecha.localeCompare(a.fecha))){
    if(!s.blocks)continue;
    const p=eParse(s.blocks),tablas=[];
    eTables(p.intro,[]).forEach(t=>tablas.push({tema:'',t}));
    for(const sec of p.secs)if(sec.kind==='consulta'||sec.kind==='texto')eTables(sec.blocks,[]).forEach(t=>tablas.push({tema:sec.title||sec.head||'',t}));
    if(tablas.length)dias.push({s,tablas});
  }
  return dias;
}
/* ---------- 🗺️ Temas por fase: lista del instructor con el % de cada tema (no visto = 0) ----------
   Si una sesión más reciente trae el mismo tema en «Tema» (por código, p. ej. «1.2», o por nombre)
   con «Dominio tema %», se usa ese valor: así el tema del día está al día aunque la fila no se haya tocado. */
const tNorm=s=>String(s||'').toLowerCase().normalize('NFKC').replace(/s+/g,' ').trim();
function temaDeSesion(t){
  let best=null;
  for(const s of Object.values(E.ses)){
    if(typeof s.domTema!=='number'||!s.tema)continue;
    const st=tNorm(s.tema),cod=tNorm(t.codigo);
    // por código: «1.2» al inicio, sin confundirlo con «1.20»
    const ok=!!cod&&st.startsWith(cod)&&!/^[\d.]/.test(st.slice(cod.length));
    if(!ok&&!(st===tNorm(t.tema)||st.includes(tNorm(t.tema))))continue;
    if(!best||(s.edited||s.fecha)>(best.edited||best.fecha))best=s;
  }
  return best&&(!t.edited||(best.edited||'')>t.edited)?best:null;
}
function temaPct(t){const s=temaDeSesion(t);let v=s?s.domTema:t.dom;if(typeof v!=='number')return null;if(v>0&&v<1)v*=100;return Math.max(0,Math.min(100,Math.round(v)))}

    ${eSubTabs()}
    ${fases.length?fases.map((f,i)=>{const l=ts.filter(t=>t.fase===f),ps=l.map(temaPct),dom=ps.filter(v=>v===100).length;
      return `<details class="esec etf" ${(actual?f===actual:i===0)?'open':''}><summary><b>${esc(f)} (Temas)</b><span class="muted small">${dom}/${l.length} dominados · ${String(Math.round(1000*dom/l.length)/10).replace('.',',')}%</span></summary>
        ${l.map((t,j)=>{const v=ps[j],cls=v===100?'ok':v===0?'cero':v==null?'sin':'';
          return `<div class="etema"><span class="en">${t.codigo?`<span class="ec">${esc(t.codigo)}</span>`:''}${esc(t.tema)}</span><span class="ep ${cls}">${v==null?'sin medir':v===100?'✅ 100%':v+'%'}</span>
            <span class="eb"><i class="${v===100?'ok':''}" style="width:${v||0}%"></i></span>${t.nota?`<span class="etnota">${esc(t.nota)}</span>`:''}</div>`}).join('')}

var matQ='';
/* Buscar por día: «día 34», «dia34», «34», «29 oct», «29/10» o «2026-10-29» → función que dice si una sesión es de ese día */
const MESES={ene:1,feb:2,mar:3,abr:4,may:5,jun:6,jul:7,ago:8,sep:9,set:9,oct:10,nov:11,dic:12};
function diaDe(q){q=String(q||'').trim().toLowerCase();if(!q)return null;let m;
  if(m=q.match(/^(?:d[ií]a|d)\s*(\d{1,3})$/)||q.match(/^(\d{1,3})$/)){const re=new RegExp('^d[ií]a\\s*'+m[1]+'(?!\\d)','i');return s=>re.test(s.titulo||'')}
  if(/^\d{4}-\d\d-\d\d$/.test(q))return s=>s.fecha===q;
  if(m=q.match(/^(\d{1,2})\s*(?:\/|-|\s|\s+de\s+)\s*(\d{1,2}|[a-z]{3})[a-z]*$/)){const mes=/^\d/.test(m[2])?+m[2]:MESES[m[2]];if(!mes)return null;
    const fin='-'+String(mes).padStart(2,'0')+'-'+m[1].padStart(2,'0');return s=>(s.fecha||'').endsWith(fin)}
  return null}
const diaCorto=s=>{const m=(s.titulo||'').match(/^d[ií]a\s*\d+/i);return m?m[0].replace(/^d[ií]a\s*/i,'Día '):eFechaCorta(s.fecha)};
