/* ---------- Entrega ---------- */
function eCollect(s){
  const w=eWork(s.id),p=eParse(s.blocks),acts=[];let dudas=0,total=0;
  for(const sec of p.secs){
    if(!['tarea','practica','fuera','consulta'].includes(sec.kind))continue;
    const ms=eMs(w.tim[sec.id]);if(sec.kind==='consulta'&&!ms)continue;total+=ms;
    const items=sec.items.map(b=>{const a=w.ans[b.id]||{};if(a.duda)dudas++;return{p:ptxt(b.rt),r:a.r||'',duda:!!a.duda,nota:a.nota||'',hecho:!!a.hecho}});
    acts.push({tipo:sec.oral?'oral':sec.kind,titulo:sec.title,min:Math.round(ms/60000),items});
  }
  return{acts,dudas,minutos:Math.round(total/60000)};
}
function eTexto(s,c){
  const L=[`📤 Entrega — ${s.titulo} (${s.fecha}) · ${c.minutos} min${c.dudas?` · ${c.dudas} duda${c.dudas>1?'s':''}`:''}`];
  for(const a of c.acts){
    L.push('',`${E_LABEL[a.tipo]}: ${a.titulo} — ${a.min} min`);
    a.items.forEach((it,i)=>{
      if(a.tipo==='fuera')L.push(`${it.hecho?'[x]':'[ ]'} ${it.p}`);
      else{const am=it.r.match(AU_MARCA);L.push(`${i+1}. ${it.p}`,`→ ${am?`🎙️ audio de ${am[2]} s (se escucha en Notion) · transcripción automática: ${it.r.slice(am[0].length).trim()||'(no entendió nada)'}`:it.r.trim()||'(sin respuesta)'}`)}
      if(it.duda)L.push(`❓ Duda: ${it.nota||'(sin nota)'}`);
    });
  }
  return L.join('\n');
}

/* ---------- Panel de progreso ----------
   Un gráfico por pregunta, una sola serie cada uno (más su línea de referencia), marcas finas,
   etiquetas solo donde importan, valor al tocar/pasar y tabla «Ver datos» para cada gráfico. */
const P_INICIO='2026-07-29',P_EXAMEN='2027-07-15';
const dms=f=>new Date(f+'T12:00:00').getTime();
function verTip(el){const c=el.closest('.chart');if(!c)return;c.querySelectorAll('.sel').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');const cap=c.querySelector('.ccap');if(cap)cap.textContent=el.dataset.tip}
function tabla(cols,rows){return `<details class="cdatos"><summary>Ver datos</summary><div class="etw"><table><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</table></div></details>`}
const W=340,H=170,ML=30,MR=12,MT=14,MB=24;
function ejeY(max,paso,fmt){let s='';for(let v=0;v<=max+1e-9;v+=paso){const y=MT+(H-MT-MB)*(1-v/max);s+=`<line x1="${ML}" x2="${W-MR}" y1="${y}" y2="${y}" class="cgrid"/><text x="${ML-6}" y="${y+3.5}" class="cax" text-anchor="end">${fmt(v)}</text>`}return s}
function barras(datos,{max,paso,fmt,refV,refTxt,color,refColor}){
  const n=datos.length,bw=Math.min(26,(W-ML-MR)/n-4),y0=H-MB;
  let s=ejeY(max,paso,fmt);
  datos.forEach((d,i)=>{const cx=ML+(W-ML-MR)*(i+.5)/n,hgt=Math.max(1,(H-MT-MB)*Math.min(d.v,max)/max),y=y0-hgt;
    s+=`<g data-tip="${esc(d.tip)}" class="cmk"><rect x="${cx-bw/2-4}" y="${MT}" width="${bw+8}" height="${H-MT-MB}" fill="transparent"/><path d="M${cx-bw/2},${y0}V${y+4}q0,-4 4,-4h${bw-8}q4,0 4,4V${y0}Z" fill="${d.c||color}"/></g>`;
    if(i===n-1||i===0)s+=`<text x="${cx}" y="${H-8}" class="cax" text-anchor="middle">${esc(d.label)}</text>`;
    if(i===n-1)s+=`<text x="${cx}" y="${y-5}" class="clbl" text-anchor="middle">${esc(fmt(d.v))}</text>`;
  });
  if(refV!=null){const y=MT+(H-MT-MB)*(1-refV/max),rc=refColor?` style="stroke:${refColor};stroke-width:2"`:'',tc=refColor?` style="fill:${refColor};font-weight:800;stroke:var(--surface);stroke-width:3px;paint-order:stroke"`:'';s+=`<line x1="${ML}" x2="${W-MR}" y1="${y}" y2="${y}" class="cref"${rc}/><text x="${ML+4}" y="${y-4}" class="cax"${tc}>${esc(refTxt)}</text>`}
  return `<svg viewBox="0 0 ${W} ${H}" class="csvg" role="img">${s}</svg>`;
}
function lineas(serie,{max,paso,fmt,x0,x1,refV,refTxt,ref2,color}){
  const X=t=>ML+(W-ML-MR)*(t-x0)/Math.max(1,x1-x0),Y=v=>MT+(H-MT-MB)*(1-Math.min(v,max)/max);
  let s=ejeY(max,paso,fmt);
  if(refV!=null){const y=Y(refV);s+=`<line x1="${ML}" x2="${W-MR}" y1="${y}" y2="${y}" class="cref"/><text x="${ML+4}" y="${y-4}" class="cax">${esc(refTxt)}</text>`}
  if(ref2)s+=`<line x1="${X(ref2.t0)}" y1="${Y(ref2.v0)}" x2="${X(ref2.t1)}" y2="${Y(ref2.v1)}" class="cref"/>`;
  if(serie.length>1)s+=`<polyline points="${serie.map(p=>X(p.t)+','+Y(p.v)).join(' ')}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  const s2=arguments[1].serie2,c2=arguments[1].color2;
  if(s2){if(s2.length>1)s+=`<polyline points="${s2.map(p=>X(p.t)+','+Y(p.v)).join(' ')}" fill="none" stroke="${c2}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    s2.forEach((p,i)=>{s+=`<g data-tip="${esc(p.tip)}" class="cmk"><circle cx="${X(p.t)}" cy="${Y(p.v)}" r="12" fill="transparent"/><circle cx="${X(p.t)}" cy="${Y(p.v)}" r="4" fill="${c2}" stroke="var(--surface)" stroke-width="2"/></g>`;if(i===s2.length-1)s+=`<text x="${Math.min(X(p.t),W-MR-8)}" y="${Y(p.v)+(serie.length&&p.v>serie[serie.length-1].v?-9:18)}" class="clbl" text-anchor="middle">${esc(Math.round(p.v)+'%')}</text>`})}
  serie.forEach((p,i)=>{s+=`<g data-tip="${esc(p.tip)}" class="cmk"><circle cx="${X(p.t)}" cy="${Y(p.v)}" r="12" fill="transparent"/><circle cx="${X(p.t)}" cy="${Y(p.v)}" r="4" fill="${color}" stroke="var(--surface)" stroke-width="2"/></g>`;
    if(i===serie.length-1){const o2=arguments[1].serie2,u=o2&&o2.length?o2[o2.length-1].v:null,abajo=u!=null&&p.v<u;s+=`<text x="${Math.min(X(p.t),W-MR-8)}" y="${Y(p.v)+(abajo?18:-9)}" class="clbl" text-anchor="middle">${esc(fmt(p.v))}</text>`}});
  const f2=t=>eFechaCorta(new Date(t).toISOString().slice(0,10));
  s+=`<text x="${ML}" y="${H-8}" class="cax">${f2(x0)}</text><text x="${W-MR}" y="${H-8}" class="cax" text-anchor="end">${f2(x1)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" class="csvg" role="img">${s}</svg>`;
}
function semana(t){const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()}
function topErrores(){

  for(const e of S.ev)if(e.k==='a'&&e.t>=desde&&!e.o)m[e.q]=(m[e.q]||0)+1;

}

function onClick(e){
  const tip=e.target.closest&&e.target.closest('[data-tip]');if(tip&&tip.closest('.chart')){verTip(tip);return}
  const t=e.target.closest('button');
  if(t&&t.dataset.e){eClick(t);return}
  if(!t){if(view==='drill'&&sess&&sess.state==='fb'&&e.target.closest('.fb'))cont();return}
  const d=t.dataset;
  if(d.ans!=null){if(sess.state==='q')answer(+d.ans);else cont();return}
  if(d.mode){S.settings.mode=d.mode;save();startSession(d.mode);if(view==='home')render();return}
  if(d.dur){S.settings.dur=+d.dur;save();render();return}
  if(d.press){S.settings.pressure=d.press==='1';save();render();return}
  if(d.furi){S.settings.furi=d.furi==='1';save();render();return}
  if(d.theme){S.settings.theme=d.theme;save();render();return}
  if(d.dev){S.dev.name=d.dev;save();render();return}
  switch(d.act){
    case 'start':case 'again':startSession(S.settings.mode);break;
    case 'home':view='home';sess=null;render();break;
    case 'stats':view='stats';render();break;
    case 'prog':view='prog';render();break;
    case 'practicar-top':startSession('top');break;
    case 'quit':endSession();break;
    case 'prodcheck':prodCheck();break;
    case 'prodbad':answer(0,{ok:false,typed:sess.typed});break;
    case 'prodok':answer(0,{ok:true,exact:false,typed:sess.typed});break;
    case 'prodnext':cont();break;
    case 'export':exportData();break;
    case 'syncpill':{const det=document.querySelector('details.card');if(!syncConfigured()&&det){det.open=true;det.scrollIntoView({behavior:'smooth'})}else syncNow(true);break}
    case 'syncsave':S.settings.syncUrl=$('#sUrl').value.trim();S.settings.syncKey=$('#sKey').value.trim();save();
      if(!syncConfigured()){toast('Sincronización desactivada');render()}else syncNow(true);break;
    case 'import':$('#imp').click();break;
    case 'reset':if(confirm(syncConfigured()?'¿Borrar el progreso de ESTE dispositivo? Lo que ya está en la nube se volverá a descargar al sincronizar.':'¿Borrar todo el progreso? Exporta un respaldo antes si lo quieres conservar.')){const keep=S.settings;S=fresh();S.settings=keep;derivedReset(S);save();render();toast('Progreso borrado');syncNow()}break;
  }
}
function onKey(e){
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key;
  if(e.target&&e.target.id==='prodIn'){if(k==='Enter'&&!e.isComposing){e.preventDefault();prodCheck()}return} // Enter durante la conversión a kanji no envía
  if(view==='drill'&&sess&&sess.state==='judge'){if(k==='1')answer(0,{ok:false,typed:sess.typed});else if(k==='2')answer(0,{ok:true,exact:false,typed:sess.typed});return}
  if(e.target&&e.target.matches&&e.target.matches('input,textarea,select'))return;
  if(view==='sesion'){if(k==='Escape'){view='estudio';eOpen=null;render()}return}
  if(view==='estudio'){if(k==='Escape'){view='home';render()}return}
  if(view==='drill'&&sess){
    if(sess.state==='q'&&/^[1-4]$/.test(k)&&+k<=sess.cur.opts.length){e.preventDefault();answer(+k-1)}
    else if(sess.state==='fb'&&(k==='Enter'||k===' '||k==='ArrowRight')){e.preventDefault();cont()}
    else if(k==='Escape')endSession();
  }else if(view==='home'){if(k==='Enter'&&!(e.target.closest&&e.target.closest('button'))){e.preventDefault();startSession(S.settings.mode)}else if(k==='s')(view='stats',render())}
  else if(view==='end'){if(k==='Enter'){e.preventDefault();startSession(S.settings.mode)}else if(k==='Escape'){view='home';sess=null;render()}}
  else if((view==='stats'||view==='prog')&&k==='Escape'){view='home';render()}
}

    const f=e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const d=JSON.parse(r.result);
      if(d.v===2&&Array.isArray(d.ev)){const have=new Set(S.ev.map(e=>e.i));for(const e of d.ev)if(!have.has(e.i)){S.ev.push(e);S.outbox.push(e.i)}}
      else if(d.v===1){const e={t:1,k:'b',snap:{items:d.items,buffer:d.buffer,cats:d.cats,days:d.days,sessions:d.sessions,best:d.best}};e.i=S.dev.id+'-imp-'+rid();e.d=S.dev.id;S.ev.push(e);S.outbox.push(e.i)}
      else throw 0;
      rebuild();save();render();toast('Respaldo importado y fusionado');syncNow()}catch(err){toast('Archivo no válido')}};
    r.readAsText(f);e.target.value='';
  });
  try{load()}catch(e){S=fresh();derivedReset(S)}
  eLoad();
  document.addEventListener('focusin',e=>{const t=e.target;if(t&&t.dataset&&t.dataset.it&&t.matches('textarea,input'))eAutoTimer(t)});
  document.addEventListener('input',e=>{if(e.target.id==='eBuscar')return eFiltrar(e.target.value);if(e.target.id==='matBuscar'){matQ=e.target.value;return matFiltrar()}if(e.target.dataset&&e.target.dataset.a&&e.target.type!=='checkbox')eInput(e.target)});
  document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.a&&e.target.type==='checkbox')eInput(e.target)});
  document.addEventListener('change',e=>{const it=e.target.dataset&&e.target.dataset.auFile,f=e.target.files&&e.target.files[0];if(it&&f){e.target.value='';auArchivo(it,f)}});
  document.addEventListener('change',e=>{const id=e.target.dataset&&e.target.dataset.simpdf,f=e.target.files&&e.target.files[0];if(!id||!f)return;
    const el=document.getElementById('simPdf');if(el)el.innerHTML='<div class="muted small" style="padding:10px">Cargando las preguntas…</div>';simPdfCargar(id,f)});
  setInterval(eTick,1000);
  render();requestAnimationFrame(tick);
  syncNow();
  addEventListener('online',()=>{syncNow();eSync();bSync()});
  eSync();
  addEventListener('offline',()=>{syncState=syncConfigured()?'offline':'off';refreshSync()});
  // versión nueva de la app: se revisa cada minuto mientras está a la vista (antes solo al volver a abrirla)
  setInterval(()=>{if(!document.hidden)buscarVersion()},60000);addEventListener('online',buscarVersion);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){syncNow();eSync();bSync();buscarVersion()}else{bCorriendo();eSave();bSync(true)}});
  bSync();setInterval(()=>{if(!document.hidden&&view!=='drill')bSync()},15000);
  setInterval(()=>{if(!document.hidden&&view!=='drill')eSync()},180000);
  setInterval(()=>{if(view==='home'||view==='stats')syncNow()},120000);
  if(location.hash==='#go')startSession(S.settings.mode);
  if(location.hash==='#tabla'){view='tabla';render()}
  addEventListener('hashchange',()=>{if(location.hash==='#tabla'){view='tabla';render()}});
  // PWA: funciona offline tras la primera visita y pide que Android no borre los datos
  if(location.protocol.startsWith('http')&&'serviceWorker' in navigator){
    const habia=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js').then(r=>{swReg=r}).catch(()=>{});
    navigator.serviceWorker.addEventListener('controllerchange',()=>{if(habia){recargaPendiente=true;intentarRecarga()}});
    setInterval(intentarRecarga,5000);
  }
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
}

/* Materia: los bloques se abren solo al tocarlos y siguen abiertos aunque la pantalla se actualice al sincronizar */
var matAbiertos=new Set();
document.addEventListener('toggle',e=>{const d=e.target;if(d&&d.matches&&d.matches('details[data-mat]')){if(d.open)matAbiertos.add(d.dataset.mat);else matAbiertos.delete(d.dataset.mat)}},true);
</script>
